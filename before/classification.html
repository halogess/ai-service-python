        // Page navigation
        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                updatePageButtons();
                loadPageData();
            }
        }

        function updatePageButtons() {
            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('btnPrevPage').disabled = currentPage <= 1;
            document.getElementById('btnNextPage').disabled = currentPage >= totalPages;
        }

        // Load page data (image + merging extraction)
        async function loadPageData() {
            const canvasLoading = document.getElementById('canvasLoading');
            canvasLoading.style.display = 'flex';

            // Save showAll states before reset (for persistence across page changes)
            const savedShowAllAlignBbox = showAllAlignBbox;
            const savedShowAllUnaligned = showAllUnaligned;

            // Reset alignment bboxes
            visibleAlignBbox.clear();
            showAllAlignBbox = false;
            updateShowAllAlignBboxBtn();

            // Reset extraction
            extractionData = null;
            extractionItems = [];

            try {
                // Load page image
                const imgResponse = await fetch(`/pymupdf-api/page-image/${docId}/${currentPage}`);
                const imgData = await imgResponse.json();

                if (imgData.success && imgData.image_base64) {
                    // Convert base64 to blob, then to ImageBitmap
                    const binaryData = atob(imgData.image_base64);
                    const bytes = new Uint8Array(binaryData.length);
                    for (let i = 0; i < binaryData.length; i++) {
                        bytes[i] = binaryData.charCodeAt(i);
                    }
                    const blob = new Blob([bytes], { type: 'image/png' });
                    pageImage = await createImageBitmap(blob);
                } else {
                    console.error('Failed to load page image:', imgData.error);
                    pageImage = null;
                }

                // Load section data (for header/footer margin lines)
                try {
                    const secResponse = await fetch(`/dokumen-elemen-api/sections/${docId}`);
                    const secData = await secResponse.json();
                    if (secData.success && secData.sections && secData.sections.length > 0) {
                        // Find the section that matches current page dimensions
                        if (pageImage && secData.sections.length > 1) {
                            const pageWidth = pageImage.width / 1.5;  // Undo the 1.5 scale
                            const pageHeight = pageImage.height / 1.5;

                            // Find section with matching dimensions (tolerance of 10 points)
                            const matchingSection = secData.sections.find(sec => {
                                const secWidth = sec.page_width_pt || 595;
                                const secHeight = sec.page_height_pt || 842;
                                const widthMatch = Math.abs(secWidth - pageWidth) < 10;
                                const heightMatch = Math.abs(secHeight - pageHeight) < 10;
                                return widthMatch && heightMatch;
                            });

                            sectionData = matchingSection || secData.sections[0];
                        } else {
                            sectionData = secData.sections[0];
                        }
                        console.log('Section data loaded:', sectionData);
                    } else {
                        sectionData = null;
                    }
                } catch (secErr) {
                    console.error('Error loading section data:', secErr);
                    sectionData = null;
                }

                // Load PDF extraction data (merging) - main data source for alignment
                try {
                    if (typeof PdfExtraction !== 'undefined') {
                        extractionData = await PdfExtraction.extractMergingData(docId, currentPage);
                        extractionItems = extractionData.items;
                    }
                } catch (extErr) {
                    console.error('Extraction error:', extErr);
                }

                drawCanvas();

                // Run Docling classification (doesn't need alignment data)
                runDoclingClassification();

                // Run alignment after extraction is loaded (pass saved states to restore)
                await runAlignment(savedShowAllAlignBbox, savedShowAllUnaligned);

                // Run LayoutLM classification AFTER alignment completes
                // (now uses matched_pdf_units from alignments)
                runClassification();

            } catch (error) {
                console.error('Error loading page data:', error);
            }

            canvasLoading.style.display = 'none';
        }

        // Draw canvas
        function drawCanvas() {
            const canvas = document.getElementById('pdfCanvas');
            const ctx = canvas.getContext('2d');

            if (!pageImage) return;

            // Set canvas size
            canvas.width = pageImage.width;
            canvas.height = pageImage.height;

            // Draw the page image
            ctx.drawImage(pageImage, 0, 0);

            const scale = 1.5;

            // Draw header and footer margin lines if section data is available
            if (showMarginLines && sectionData) {
                const pageHeightPt = sectionData.page_height_pt || 842;
                const pageWidthPt = sectionData.page_width_pt || 595;

                const marginTopPt = sectionData.margin_top_pt || 72;
                const marginBottomPt = sectionData.margin_bottom_pt || 72;
                const headerMarginPt = sectionData.header_margin_pt || 36;
                const footerMarginPt = sectionData.footer_margin_pt || 36;

                const headerLineY = marginTopPt * scale;
                const footerLineY = (pageHeightPt - marginBottomPt) * scale;
                const headerZoneLineY = headerMarginPt * scale;
                const footerZoneLineY = (pageHeightPt - footerMarginPt) * scale;

                const canvasWidth = canvas.width;

                // Draw header margin line (blue dashed line)
                ctx.strokeStyle = '#2196F3';
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 5]);

                // Header zone line (lighter, thinner)
                ctx.strokeStyle = '#64B5F6';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, headerZoneLineY);
                ctx.lineTo(canvasWidth, headerZoneLineY);
                ctx.stroke();

                // Main header line (content area top)
                ctx.strokeStyle = '#2196F3';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, headerLineY);
                ctx.lineTo(canvasWidth, headerLineY);
                ctx.stroke();

                // Footer zone line (lighter, thinner)
                ctx.strokeStyle = '#64B5F6';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, footerZoneLineY);
                ctx.lineTo(canvasWidth, footerZoneLineY);
                ctx.stroke();

                // Main footer line (content area bottom)
                ctx.strokeStyle = '#2196F3';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, footerLineY);
                ctx.lineTo(canvasWidth, footerLineY);
                ctx.stroke();

                ctx.setLineDash([]);

                // Draw labels
                ctx.font = 'bold 10px Arial';
                ctx.fillStyle = '#2196F3';
                ctx.fillText('↑ HEADER ZONE', 5, headerLineY - 5);
                ctx.fillText('↓ FOOTER ZONE', 5, footerLineY + 12);
            }

            // Draw visible unaligned groups bboxes (Red)
            unalignedGroups.forEach((g, idx) => {
                if (!visibleUnaligned.has(idx)) return;

                const bbox = g.bbox;
                if (bbox && bbox.length >= 4) {
                    ctx.strokeStyle = '#e74c3c';  // Red for unaligned
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([6, 3]);
                    ctx.strokeRect(
                        bbox[0] * scale,
                        bbox[1] * scale,
                        (bbox[2] - bbox[0]) * scale,
                        (bbox[3] - bbox[1]) * scale
                    );
                    ctx.setLineDash([]);

                    // Draw label
                    const groupNum = g.group_id ? g.group_id.replace(/\D/g, '') : idx;
                    ctx.font = 'bold 10px Arial';
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillText(`[G${groupNum}] ❌`, bbox[0] * scale, bbox[1] * scale - 2);
                }
            });

            // Draw visible alignment bboxes (merged bbox from matched groups)
            alignments.forEach(a => {
                const parentVisible = visibleAlignBbox.has(a.element_id);

                if (a.is_table && a.cells) {
                    // Table: draw parent bbox if visible
                    if (parentVisible) {
                        const bbox = a.merged_bbox;
                        if (bbox && bbox.length >= 4) {
                            ctx.strokeStyle = '#e74c3c';  // Red for tables
                            ctx.lineWidth = 3;
                            ctx.setLineDash([8, 4]);
                            ctx.strokeRect(
                                bbox[0] * scale,
                                bbox[1] * scale,
                                (bbox[2] - bbox[0]) * scale,
                                (bbox[3] - bbox[1]) * scale
                            );
                            ctx.setLineDash([]);

                            // Draw table label
                            ctx.font = 'bold 12px Arial';
                            ctx.fillStyle = '#e74c3c';
                            ctx.fillText(`#${a.element_sequence} ${a.element_type}`, bbox[0] * scale, bbox[1] * scale - 4);
                        }
                    }

                    // Draw individual cell bboxes
                    a.cells.forEach(cell => {
                        const cellId = `${a.element_id}_r${cell.row}_c${cell.col}`;
                        if (!visibleAlignBbox.has(cellId)) return;

                        const bbox = cell.merged_bbox;
                        if (bbox && bbox.length >= 4) {
                            ctx.strokeStyle = '#c0392b';  // Darker red for cells
                            ctx.lineWidth = 2;
                            ctx.setLineDash([4, 2]);
                            ctx.strokeRect(
                                bbox[0] * scale,
                                bbox[1] * scale,
                                (bbox[2] - bbox[0]) * scale,
                                (bbox[3] - bbox[1]) * scale
                            );
                            ctx.setLineDash([]);

                            // Draw cell label
                            ctx.font = 'bold 10px Arial';
                            ctx.fillStyle = '#c0392b';
                            ctx.fillText(`[R${cell.row},C${cell.col}]`, bbox[0] * scale, bbox[1] * scale - 2);
                        }
                    });
                } else {
                    // Non-table: use unit_id for visibility check if available
                    const alignKey = a.unit_id || a.element_id;
                    if (!visibleAlignBbox.has(alignKey)) return;

                    const bbox = a.merged_bbox;
                    if (bbox && bbox.length >= 4) {
                        // Use different color for image parts
                        if (a.is_image_part) {
                            ctx.strokeStyle = '#27ae60'; // Green for images
                        } else if (a.is_text_part) {
                            ctx.strokeStyle = '#3498db'; // Blue for text parts
                        } else {
                            ctx.strokeStyle = '#27ae60'; // Default green
                        }
                        ctx.lineWidth = 3;
                        ctx.setLineDash([8, 4]);
                        ctx.strokeRect(
                            bbox[0] * scale,
                            bbox[1] * scale,
                            (bbox[2] - bbox[0]) * scale,
                            (bbox[3] - bbox[1]) * scale
                        );
                        ctx.setLineDash([]);

                        // Draw element label with part type
                        ctx.font = 'bold 12px Arial';
                        ctx.fillStyle = a.is_image_part ? '#27ae60' : (a.is_text_part ? '#3498db' : '#27ae60');
                        const partSuffix = a.is_text_part ? ' [TEXT]' : (a.is_image_part ? ' [IMG]' : '');
                        ctx.fillText(`#${a.element_sequence} ${a.element_type}${partSuffix}`, bbox[0] * scale, bbox[1] * scale - 4);
                    }
                }
            });


            // Draw classification bboxes (from LayoutLM predictions)
            drawClassificationBboxes(ctx, scale);

            // Draw Docling classification bboxes
            drawDoclingBboxes(ctx, scale);
        }

        // ==========================================
        // CLASSIFICATION FUNCTIONS (LayoutLM)
        // ==========================================

        let classifications = [];
        let classificationsByAlignment = [];  // Results grouped by OpenXML element
        let unalignedClassifications = [];    // Predictions not matched to any alignment
        let visibleClassifyBbox = new Set();
        let showAllClassify = false;

        // Color mapping for classification labels
        const LABEL_COLORS = {
            'title': '#e74c3c',
            'text': '#3498db',
            'paragraph': '#3498db',
            'list_item': '#2ecc71',
            'table': '#f39c12',
            'picture': '#9b59b6',
            'caption': '#1abc9c',
            'section_header': '#e74c3c',
            'page_header': '#e67e22',
            'page_footer': '#c0392b',
            'footnote': '#8b4513',
            'formula': '#008080',
            'code': '#00CED1',
            'unknown': '#95a5a6'
        };

        // Merge text groups into lines based on Y-overlap
        // Groups on the same line (>30% vertical overlap) are merged into one line
        function mergeGroupsIntoLines(groups, yOverlapThreshold = 0.3) {
            if (!groups || groups.length === 0) return [];

            // Filter valid groups with text and bbox
            const validGroups = groups.filter(g => g.text && g.bbox && g.bbox.length >= 4);
            if (validGroups.length === 0) return [];

            // Sort by Y position (top to bottom)
            validGroups.sort((a, b) => a.bbox[1] - b.bbox[1]);

            const lines = [];
            let currentLine = [validGroups[0]];

            for (let i = 1; i < validGroups.length; i++) {
                const curr = validGroups[i];
                const prev = currentLine[currentLine.length - 1];

                // Calculate Y overlap
                const prevY0 = prev.bbox[1], prevY1 = prev.bbox[3];
                const currY0 = curr.bbox[1], currY1 = curr.bbox[3];
                const prevHeight = prevY1 - prevY0;

                if (prevHeight > 0) {
                    const overlap = Math.max(0, Math.min(prevY1, currY1) - Math.max(prevY0, currY0));
                    const overlapRatio = overlap / prevHeight;

                    if (overlapRatio >= yOverlapThreshold) {
                        // Same line - add to current line
                        currentLine.push(curr);
                    } else {
                        // New line - merge current line and start new
                        lines.push(mergeLine(currentLine));
                        currentLine = [curr];
                    }
                } else {
                    // Zero height - treat as new line
                    lines.push(mergeLine(currentLine));
                    currentLine = [curr];
                }
            }

            // Merge last line
            if (currentLine.length > 0) {
                lines.push(mergeLine(currentLine));
            }

            return lines;
        }

        // Helper: merge multiple groups into a single line
        function mergeLine(groups) {
            if (!groups || groups.length === 0) return null;

            // Sort by X (left to right) for correct text order
            const sortedGroups = [...groups].sort((a, b) => a.bbox[0] - b.bbox[0]);

            // Merge text with space
            const text = sortedGroups.map(g => g.text).join(' ');

            // Merge bbox: min(x0), min(y0), max(x1), max(y1)
            const x0 = Math.min(...sortedGroups.map(g => g.bbox[0]));
            const y0 = Math.min(...sortedGroups.map(g => g.bbox[1]));
            const x1 = Math.max(...sortedGroups.map(g => g.bbox[2]));
            const y1 = Math.max(...sortedGroups.map(g => g.bbox[3]));

            return {
                text: text,
                bbox: [x0, y0, x1, y1],
                groupCount: groups.length
            };
        }

        async function runClassification() {
            const container = document.getElementById('classificationList');

            // Wait for alignment data to be available
            if (!alignments || alignments.length === 0) {
                // If no alignments yet, check if we at least have extraction data for margin/unaligned
                if (!extractionData || !extractionData.rawdata) {
                    container.innerHTML = '<div style="padding: 15px; text-align: center; color: #888;">Waiting for alignment data...</div>';
                    return;
                }
            }

            // Build extraction groups from THREE sources:
            // 1. matched_pdf_units from alignments (individual units)
            // 2. headerFooterUnits (margin content - header/footer)
            // 3. unalignedGroups (PDF units without OpenXML match)
            const extractionGroups = [];

            // Source 1: matched_pdf_units from each alignment
            let alignedCount = 0;
            alignments.forEach(a => {
                // For tables, matched_pdf_units are inside cells
                if (a.is_table && a.cells) {
                    a.cells.forEach(cell => {
                        (cell.matched_pdf_units || []).forEach(unit => {
                            if (unit.text && unit.bbox) {
                                extractionGroups.push({
                                    text: unit.text,
                                    bbox: unit.bbox,
                                    type: 'aligned',
                                    element_id: a.element_id,
                                    element_type: 'table_cell'
                                });
                                alignedCount++;
                            }
                        });
                    });
                } else {
                    // Non-table elements have matched_pdf_units at top level
                    // Backend sends is_image_part and is_text_part as boolean flags on each alignment
                    const isImagePart = a.is_image_part === true;
                    const isTextPart = a.is_text_part === true;

                    // Process matched_pdf_units with appropriate type marking
                    (a.matched_pdf_units || []).forEach(unit => {
                        if (unit.bbox) {
                            // For image parts, use [IMG] as text if no text available
                            const text = isImagePart ? (unit.text || '[IMG]') : unit.text;
                            if (!text && !isImagePart) return;  // Skip if no text and not image

                            // Determine if this is an image (from alignment flag or unit properties)
                            const isImage = isImagePart || unit.is_image || unit.item_type === 'image';

                            extractionGroups.push({
                                text: text || '[IMG]',
                                bbox: unit.bbox,
                                type: 'aligned',
                                element_id: a.element_id,
                                element_type: isImage ? 'image' : a.element_type,
                                is_image: isImage,
                                is_text_part: isTextPart,
                                is_image_part: isImagePart
                            });
                            alignedCount++;
                        }
                    });
                }
            });

            // Source 2: headerFooterUnits (margin char_groups)
            let marginCount = 0;
            headerFooterUnits.forEach(unit => {
                if (unit.text && unit.bbox) {
                    extractionGroups.push({
                        text: unit.text,
                        bbox: unit.bbox,
                        type: 'margin',
                        zone: unit.zone  // 'header' or 'footer'
                    });
                    marginCount++;
                }
            });

            // Source 3: unalignedGroups (PDF units without OpenXML match)
            let unalignedCount = 0;
            unalignedGroups.forEach(unit => {
                if (unit.text && unit.bbox) {
                    extractionGroups.push({
                        text: unit.text,
                        bbox: unit.bbox,
                        type: 'unaligned'
                    });
                    unalignedCount++;
                }
            });

            if (extractionGroups.length === 0) {
                container.innerHTML = '<div style="padding: 15px; text-align: center; color: #888;">No units to classify</div>';
                return;
            }

            console.log(`[Classification] Using ${extractionGroups.length} groups from alignments (${alignedCount} aligned + ${marginCount} margin + ${unalignedCount} unaligned)`);

            // Show loading
            container.innerHTML = '<div style="padding: 20px; text-align: center;"><i class="fas fa-spinner fa-spin"></i> Classifying ' + extractionGroups.length + ' units with LayoutLM...</div>';

            try {
                // Send only extraction_groups for classification (no need for alignments - we aggregate locally)
                const response = await fetch(`/classification-api/classify-groups/${docId}/${currentPage}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        extraction_groups: extractionGroups,
                        alignments: []  // Empty - we don't need backend matching anymore
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Backend returns predictions in unaligned_predictions (since no alignments sent)
                    // Each prediction has idx matching our extractionGroups order
                    const predictions = data.unaligned_predictions || [];

                    console.log(`[Classification] Got ${predictions.length} predictions from backend`);

                    // FRONTEND AGGREGATION: Group predictions by element_id
                    const groupedByElement = {};  // element_id -> {predictions: [], element_type, element_seq}
                    const marginPredictions = [];  // margin items (headerFooterUnits)
                    const trulyUnaligned = [];     // unalignedGroups
                    const imagePredictions = [];   // Images stay separate (no grouping/merging)

                    predictions.forEach((p, idx) => {
                        const sourceGroup = extractionGroups[p.idx !== undefined ? p.idx : idx];
                        if (!sourceGroup) return;

                        // Add source info to prediction
                        const enrichedPrediction = {
                            ...p,
                            text: sourceGroup.text,
                            bbox: sourceGroup.bbox,
                            bbox_pdf: sourceGroup.bbox,
                            element_id: sourceGroup.element_id,
                            element_type: sourceGroup.element_type,
                            source_type: sourceGroup.type  // 'aligned', 'margin', or 'unaligned'
                        };

                        // TABLE CELLS: Group by label (same label = merged bbox)
                        if (sourceGroup.element_type === 'table_cell') {
                            // Use composite key: element_id + label
                            const elemId = sourceGroup.element_id;
                            const label = enrichedPrediction.label;
                            const groupKey = `${elemId}_${label}`;  // e.g. "123_table", "123_caption"

                            if (!groupedByElement[groupKey]) {
                                const alignment = alignments.find(a => a.element_id === elemId);
                                groupedByElement[groupKey] = {
                                    element_id: elemId,
                                    element_sequence: alignment?.element_sequence,
                                    element_type: 'table',
                                    is_table: true,
                                    merged_bbox: null,  // Will be calculated from cells
                                    predictions: [],
                                    label_group: label  // Track which label this group is for
                                };
                            }

                            // Merge bbox
                            const bbox = enrichedPrediction.bbox;
                            if (bbox && bbox.length >= 4) {
                                if (!groupedByElement[groupKey].merged_bbox) {
                                    groupedByElement[groupKey].merged_bbox = [...bbox];
                                } else {
                                    const mb = groupedByElement[groupKey].merged_bbox;
                                    mb[0] = Math.min(mb[0], bbox[0]);
                                    mb[1] = Math.min(mb[1], bbox[1]);
                                    mb[2] = Math.max(mb[2], bbox[2]);
                                    mb[3] = Math.max(mb[3], bbox[3]);
                                }
                            }

                            groupedByElement[groupKey].predictions.push(enrichedPrediction);
                        } else if (sourceGroup.type === 'aligned' && sourceGroup.element_id) {
                            // Non-table aligned items
                            const elemId = sourceGroup.element_id;
                            const isImage = sourceGroup.is_image || sourceGroup.element_type === 'image';

                            if (isImage) {
                                // IMAGE: Do NOT group - each image stays separate with its own bbox and label
                                const alignment = alignments.find(a => a.element_id === elemId);
                                imagePredictions.push({
                                    element_id: elemId,
                                    element_sequence: alignment?.element_sequence,
                                    element_type: 'image',
                                    is_table: false,
                                    is_image: true,
                                    predictions: [enrichedPrediction],
                                    majority_label: enrichedPrediction.label,
                                    avg_confidence: enrichedPrediction.confidence || 0,
                                    prediction_count: 1,
                                    merged_bbox: enrichedPrediction.bbox
                                });
                            } else {
                                // TEXT: Group by element_id, use majority voting for label
                                const groupKey = `${elemId}_txt`;

                                if (!groupedByElement[groupKey]) {
                                    const alignment = alignments.find(a => a.element_id === elemId);
                                    groupedByElement[groupKey] = {
                                        element_id: elemId,
                                        element_sequence: alignment?.element_sequence,
                                        element_type: alignment?.element_type || sourceGroup.element_type,
                                        is_table: alignment?.is_table || false,
                                        is_image: false,
                                        merged_bbox: null,
                                        predictions: []
                                    };
                                }

                                // Merge bbox for text groups
                                const bbox = enrichedPrediction.bbox;
                                if (bbox && bbox.length >= 4) {
                                    if (!groupedByElement[groupKey].merged_bbox) {
                                        groupedByElement[groupKey].merged_bbox = [...bbox];
                                    } else {
                                        const mb = groupedByElement[groupKey].merged_bbox;
                                        mb[0] = Math.min(mb[0], bbox[0]);
                                        mb[1] = Math.min(mb[1], bbox[1]);
                                        mb[2] = Math.max(mb[2], bbox[2]);
                                        mb[3] = Math.max(mb[3], bbox[3]);
                                    }
                                }

                                groupedByElement[groupKey].predictions.push(enrichedPrediction);
                            }
                        } else if (sourceGroup.type === 'margin') {
                            marginPredictions.push(enrichedPrediction);
                        } else {
                            trulyUnaligned.push(enrichedPrediction);
                        }
                    });

                    // Build classificationsByAlignment from grouped data
                    classificationsByAlignment = Object.values(groupedByElement).map(group => {
                        // Calculate majority label
                        const labelCounts = {};
                        group.predictions.forEach(p => {
                            labelCounts[p.label] = (labelCounts[p.label] || 0) + 1;
                        });
                        const majorityLabel = Object.entries(labelCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || 'unknown';
                        const avgConfidence = group.predictions.reduce((sum, p) => sum + (p.confidence || 0), 0) / group.predictions.length;

                        return {
                            element_id: group.element_id,
                            element_sequence: group.element_sequence,
                            element_type: group.element_type,
                            is_table: group.is_table,
                            predictions: group.predictions,
                            majority_label: majorityLabel,
                            avg_confidence: avgConfidence,
                            prediction_count: group.predictions.length,
                            merged_bbox: group.merged_bbox
                        };
                    });

                    // Add individual images (NOT grouped/merged)
                    classificationsByAlignment = [...classificationsByAlignment, ...imagePredictions];

                    // Sort by element_sequence
                    classificationsByAlignment.sort((a, b) => (a.element_sequence || 0) - (b.element_sequence || 0));

                    // Combine margin and unaligned for display
                    unalignedClassifications = [...marginPredictions, ...trulyUnaligned];

                    console.log(`[Classification] Aggregated: ${classificationsByAlignment.length} aligned elements, ${unalignedClassifications.length} margin/unaligned`);
                    renderClassifications();
                } else {
                    container.innerHTML = `<div style="padding: 15px; color: #e74c3c;">Error: ${data.error}</div>`;
                }

            } catch (error) {
                console.error('Classification error:', error);
                container.innerHTML = `<div style="padding: 15px; color: #e74c3c;">Error: ${error.message}</div>`;
            }
        }

        function renderClassifications() {
            const container = document.getElementById('classificationList');

            // Count: aligned elements + 1 margin (if any unaligned)
            const totalItems = classificationsByAlignment.length + (unalignedClassifications.length > 0 ? 1 : 0);
            document.getElementById('classifyStats').textContent = totalItems;

            if (classificationsByAlignment.length === 0 && unalignedClassifications.length === 0) {
                container.innerHTML = '<div style="padding: 15px; text-align: center; color: #888;">No classifications</div>';
                return;
            }

            let html = '';

            // Reset classifications for canvas drawing - ONE merged item per alignment
            classifications = [];

            // Render aligned elements
            classificationsByAlignment.forEach((a, alignIdx) => {
                const majorityLabelClass = `label-${a.majority_label}`;
                const avgConfidence = (a.avg_confidence * 100).toFixed(0);

                // Merge all prediction bboxes into one - use bbox_pdf for canvas
                let mergedBbox = null;
                if (a.predictions && a.predictions.length > 0) {
                    const bboxes = a.predictions.filter(p => p.bbox_pdf && p.bbox_pdf.length >= 4).map(p => p.bbox_pdf);
                    if (bboxes.length > 0) {
                        mergedBbox = [
                            Math.min(...bboxes.map(b => b[0])),
                            Math.min(...bboxes.map(b => b[1])),
                            Math.max(...bboxes.map(b => b[2])),
                            Math.max(...bboxes.map(b => b[3]))
                        ];
                    }
                }

                // Add to classifications for canvas (bbox_pdf for drawing)
                classifications.push({
                    text: `#${a.element_sequence} ${a.element_type}`,
                    bbox_pdf: mergedBbox,
                    bbox: mergedBbox,
                    label: a.majority_label,
                    confidence: a.avg_confidence,
                    element_id: a.element_id
                });

                const isVisible = visibleClassifyBbox.has(alignIdx);

                html += `<div class="classification-item ${isVisible ? 'active' : ''}" 
                    style="margin-bottom: 4px; border-left: 3px solid #f39c12; padding-left: 8px; cursor: pointer;"
                    onclick="toggleClassifyBbox(${alignIdx})">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: 600; color: #e67e22;">#${a.element_sequence} ${a.element_type}</span>
                        <span class="label-badge ${majorityLabelClass}">${a.majority_label}</span>
                    </div>
                    <div style="font-size: 0.65rem; color: #888;">
                        ${a.prediction_count} groups | ${avgConfidence}%
                    </div>
                </div>`;
            });

            // Render each unaligned/margin item individually (DON'T merge bboxes)
            if (unalignedClassifications.length > 0) {
                html += `<div style="margin-top: 8px; border-top: 1px solid #ddd; padding-top: 8px;">
                    <div style="font-size: 0.7rem; color: #888; margin-bottom: 4px;">📍 Margin/Unaligned (${unalignedClassifications.length})</div>
                </div>`;

                unalignedClassifications.forEach((p, pIdx) => {
                    const marginIdx = classificationsByAlignment.length + pIdx;
                    const labelClass = `label-${p.label}`;
                    const confidence = ((p.confidence || 0) * 100).toFixed(0);
                    const isVisible = visibleClassifyBbox.has(marginIdx);
                    const shortText = (p.text || '').substring(0, 30) + ((p.text || '').length > 30 ? '...' : '');

                    // Add each item with its OWN bbox (not merged)
                    classifications.push({
                        text: shortText,
                        bbox_pdf: p.bbox_pdf,
                        bbox: p.bbox_pdf,
                        label: p.label,
                        confidence: p.confidence
                    });

                    html += `<div class="classification-item ${isVisible ? 'active' : ''}"
                        style="margin-bottom: 2px; border-left: 2px solid #95a5a6; padding-left: 6px; cursor: pointer; background: #fafafa; font-size: 0.7rem;"
                        onclick="toggleClassifyBbox(${marginIdx})">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;">${shortText}</span>
                            <span class="label-badge ${labelClass}" style="font-size: 0.6rem;">${p.label}</span>
                        </div>
                    </div>`;
                });
            }

            container.innerHTML = html;
        }



        function toggleClassifyBbox(idx) {
            if (visibleClassifyBbox.has(idx)) {
                visibleClassifyBbox.delete(idx);
            } else {
                visibleClassifyBbox.add(idx);
            }
            renderClassifications();
            drawCanvas();
        }

        function toggleShowAllClassify() {
            showAllClassify = !showAllClassify;
            if (showAllClassify) {
                classifications.forEach((_, idx) => visibleClassifyBbox.add(idx));
            } else {
                visibleClassifyBbox.clear();
            }
            updateShowAllClassifyBtn();
            renderClassifications();
            drawCanvas();
        }

        function clearClassifyBbox() {
            visibleClassifyBbox.clear();
            showAllClassify = false;
            updateShowAllClassifyBtn();
            renderClassifications();
            drawCanvas();
        }

        function updateShowAllClassifyBtn() {
            const btn = document.getElementById('btnShowAllClassify');
            if (showAllClassify) {
                btn.textContent = 'Hide All';
                btn.style.background = '#f39c12';
                btn.style.color = 'white';
            } else {
                btn.textContent = 'Show All';
                btn.style.background = 'white';
                btn.style.color = '#f39c12';
            }
        }

        // Draw classification bboxes on canvas
        // Note: c.bbox_pdf is in PDF points, multiply by scale (1.5) to match canvas
        function drawClassificationBboxes(ctx, scale) {
            classifications.forEach((c, idx) => {
                if (!visibleClassifyBbox.has(idx)) return;

                // Use bbox_pdf (PDF points) and apply scale, not 300 DPI bbox
                const bbox = c.bbox_pdf || c.bbox;
                if (!bbox || bbox.length < 4) return;

                const color = LABEL_COLORS[c.label] || LABEL_COLORS['unknown'];

                // Apply scale (1.5) to convert from PDF points to canvas pixels
                const x0 = bbox[0] * scale;
                const y0 = bbox[1] * scale;
                const x1 = bbox[2] * scale;
                const y1 = bbox[3] * scale;

                // Draw filled background with transparency
                ctx.fillStyle = color + '33';  // 20% opacity
                ctx.fillRect(x0, y0, x1 - x0, y1 - y0);

                // Draw border
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.setLineDash([]);
                ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);

                // Draw label
                ctx.font = 'bold 10px Arial';
                ctx.fillStyle = color;
                ctx.fillText(`[${c.label}]`, x0, y0 - 2);
            });
        }

        // ==========================================
        // DOCLING CLASSIFICATION FUNCTIONS
        // ==========================================

        let doclingClassifications = [];      // Current page's predictions
        let doclingAllPages = null;           // Cache: ALL pages predictions {page: [...], ...}
        let doclingLoaded = false;            // Flag: has document been processed?
        let doclingLoading = false;           // Flag: is processing in progress?
        let visibleDoclingBbox = new Set();
        let showAllDocling = false;
        let useAlignedBbox = false;              // Toggle: use aligned bbox instead of Docling bbox
        let doclingFusedResults = [];            // Results of alignment-Docling fusion

        // Docling color mapping (uses cyan/teal theme)
        const DOCLING_LABEL_COLORS = {
            'title': '#006064',
            'text': '#0097a7',
            'paragraph': '#0097a7',
            'list_item': '#00838f',
            'table': '#00acc1',
            'picture': '#26c6da',
            'caption': '#4dd0e1',
            'section_header': '#006064',
            'page_header': '#00838f',
            'page_footer': '#006064',
            'footnote': '#004d40',
            'formula': '#00695c',
            'code': '#00796b',
            'unknown': '#607d8b'
        };

        // Load Docling for entire document (called once)
        async function loadDoclingDocument() {
            if (doclingLoaded || doclingLoading) {
                // Already loaded or loading - just display current page
                displayDoclingForCurrentPage();
                return;
            }

            doclingLoading = true;
            const container = document.getElementById('doclingList');

            // Show loading
            container.innerHTML = '<div style="padding: 20px; text-align: center;"><i class="fas fa-spinner fa-spin"></i> Processing document with Docling...</div>';

            try {
                const response = await fetch(`/classification-api/docling-classify/${docId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                const data = await response.json();

                if (data.success) {
                    // Cache all pages' predictions
                    doclingAllPages = data.predictions_by_page || {};
                    doclingLoaded = true;
                    console.log(`[Docling] Document processed: ${Object.keys(doclingAllPages).length} pages cached`);

                    // Display current page
                    displayDoclingForCurrentPage();
                } else {
                    container.innerHTML = `<div style="padding: 15px; color: #e74c3c;">Error: ${data.error}</div>`;
                }

            } catch (error) {
                console.error('Docling classification error:', error);
                container.innerHTML = `<div style="padding: 15px; color: #e74c3c;">Error: ${error.message}</div>`;
            } finally {
                doclingLoading = false;
            }
        }

        // Display cached Docling results for current page
        function displayDoclingForCurrentPage() {
            if (!doclingLoaded || !doclingAllPages) {
                return;
            }

            // Get predictions for current page from cache
            const pageKey = String(currentPage);
            doclingClassifications = doclingAllPages[pageKey] || [];

            // Clear visibility
            visibleDoclingBbox.clear();

            console.log(`[Docling] Page ${currentPage}: ${doclingClassifications.length} predictions (from cache)`);

            // If in "Use Aligned" mode, recompute fusion for the new page
            if (useAlignedBbox) {
                // Wait a bit for alignment to complete, then fuse
                setTimeout(() => {
                    fuseAlignmentWithDocling();
                    // Auto-show all fused results
                    doclingFusedResults.forEach((_, idx) => visibleDoclingBbox.add(idx));
                    showAllDocling = true;
                    updateShowAllDoclingBtn();
                    renderDoclingClassifications();
                    drawCanvas();
                }, 500);  // Small delay to ensure alignment is done
            } else {
                // Original Docling mode - show all docling results
                if (doclingClassifications.length > 0) {
                    showAllDocling = true;
                    doclingClassifications.forEach((_, idx) => visibleDoclingBbox.add(idx));
                    updateShowAllDoclingBtn();
                }
                renderDoclingClassifications();
                drawCanvas();
            }
        }


        // Backward compatibility wrapper
        function runDoclingClassification() {
            if (doclingLoaded) {
                displayDoclingForCurrentPage();
            } else {
                loadDoclingDocument();
            }
        }

        function renderDoclingClassifications() {
            const container = document.getElementById('doclingList');
            const dataSource = useAlignedBbox ? doclingFusedResults : doclingClassifications;
            document.getElementById('doclingStats').textContent = dataSource.length;

            if (dataSource.length === 0) {
                const message = useAlignedBbox ? 'Run alignment first, then click "Use Aligned"' : 'No classifications';
                container.innerHTML = `<div style="padding: 15px; text-align: center; color: #888;">${message}</div>`;
                return;
            }

            let html = '';
            dataSource.forEach((c, idx) => {
                const isVisible = visibleDoclingBbox.has(idx);
                const labelClass = `label-${c.label}`;

                // For fused results, show overlap percentage; for Docling, show confidence
                const infoText = useAlignedBbox
                    ? (c.overlap > 0 ? `📐 ${(c.overlap * 100).toFixed(0)}%` : '📐 no match')
                    : `🔬 ${((c.confidence || 1) * 100).toFixed(0)}%`;

                // For fused mode, show source info (element sequence or header/footer zone)
                let sourceInfo = '';
                if (useAlignedBbox) {
                    if (c.source === 'header_footer') {
                        const zoneIcon = c.zone === 'header' ? '⬆️' : '⬇️';
                        sourceInfo = `<span style="font-size: 0.6rem; color: #e67e22;">${zoneIcon} ${c.zone}</span>`;
                    } else if (c.merged_count > 1) {
                        // Merged from multiple alignments
                        const seqInfo = c.element_sequences ? `#${c.element_sequences}` : '';
                        sourceInfo = `<span style="font-size: 0.6rem; color: #9b59b6;">🔗 ${c.merged_count} merged ${seqInfo}</span>`;
                    } else if (c.element_sequence) {
                        sourceInfo = `<span style="font-size: 0.6rem; color: #27ae60;">#${c.element_sequence} ${c.element_type}</span>`;
                    }
                }


                html += `<div class="docling-item ${isVisible ? 'active' : ''}" onclick="toggleDoclingBbox(${idx})">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <span class="label-badge" style="background: ${DOCLING_LABEL_COLORS[c.label] || DOCLING_LABEL_COLORS['unknown']}">${c.label}</span>
                        <span style="font-size: 0.65rem; color: #888;">${infoText}</span>
                    </div>
                    ${sourceInfo}
                    <div style="color: #333; font-size: 0.7rem; word-break: break-all;">${escapeHtml(c.text || '')}</div>
                </div>`;
            });

            container.innerHTML = html;
        }



        function toggleDoclingBbox(idx) {
            if (visibleDoclingBbox.has(idx)) {
                visibleDoclingBbox.delete(idx);
            } else {
                visibleDoclingBbox.add(idx);
            }
            renderDoclingClassifications();
            drawCanvas();
        }

        function toggleShowAllDocling() {
            showAllDocling = !showAllDocling;
            const dataSource = useAlignedBbox ? doclingFusedResults : doclingClassifications;
            if (showAllDocling) {
                dataSource.forEach((_, idx) => visibleDoclingBbox.add(idx));
            } else {
                visibleDoclingBbox.clear();
            }
            updateShowAllDoclingBtn();
            renderDoclingClassifications();
            drawCanvas();
        }


        function clearDoclingBbox() {
            visibleDoclingBbox.clear();
            showAllDocling = false;
            updateShowAllDoclingBtn();
            renderDoclingClassifications();
            drawCanvas();
        }

        function updateShowAllDoclingBtn() {
            const btn = document.getElementById('btnShowAllDocling');
            if (showAllDocling) {
                btn.textContent = 'Hide All';
                btn.style.background = '#00acc1';
                btn.style.color = 'white';
            } else {
                btn.textContent = 'Show All';
                btn.style.background = 'white';
                btn.style.color = '#00acc1';
            }
        }

        // ==========================================
        // DOCLING-ALIGNMENT FUSION FUNCTIONS
        // ==========================================

        // Calculate overlap ratio between two bboxes
        function calculateOverlap(bbox1, bbox2) {
            if (!bbox1 || !bbox2 || bbox1.length < 4 || bbox2.length < 4) return 0;

            const x0 = Math.max(bbox1[0], bbox2[0]);
            const y0 = Math.max(bbox1[1], bbox2[1]);
            const x1 = Math.min(bbox1[2], bbox2[2]);
            const y1 = Math.min(bbox1[3], bbox2[3]);

            if (x0 >= x1 || y0 >= y1) return 0;

            const intersectionArea = (x1 - x0) * (y1 - y0);
            const bbox1Area = (bbox1[2] - bbox1[0]) * (bbox1[3] - bbox1[1]);
            const bbox2Area = (bbox2[2] - bbox2[0]) * (bbox2[3] - bbox2[1]);

            // Use smaller area for ratio calculation
            const minArea = Math.min(bbox1Area, bbox2Area);
            return minArea > 0 ? intersectionArea / minArea : 0;
        }

        // Check if bbox center is in header or footer margin zone
        // Returns: 'header', 'footer', or null (in body)
        function getBboxMarginZone(bbox) {
            if (!bbox || bbox.length < 4 || !sectionData) return null;

            const pageHeightPt = sectionData.page_height_pt || 842;
            const marginTopPt = sectionData.margin_top_pt || 72;
            const marginBottomPt = sectionData.margin_bottom_pt || 72;

            // Calculate Y center of bbox
            const yCenter = (bbox[1] + bbox[3]) / 2;

            // Header zone: Y center < marginTop
            if (yCenter < marginTopPt) {
                return 'header';
            }

            // Footer zone: Y center > (pageHeight - marginBottom)
            const footerLineY = pageHeightPt - marginBottomPt;
            if (yCenter > footerLineY) {
                return 'footer';
            }

            // Body area
            return null;
        }

        // Correct page_header/page_footer labels based on actual position
        // If labeled as header/footer but not in margin zone, change to 'text'
        function correctHeaderFooterLabel(label, bbox) {
            if (label !== 'page_header' && label !== 'page_footer') {
                return label;  // Not a header/footer label, keep as is
            }

            const zone = getBboxMarginZone(bbox);

            if (label === 'page_header') {
                // If labeled as header but NOT in header zone, change to text
                if (zone !== 'header') {
                    console.log(`[Fusion] Correcting page_header → text (not in header zone, Y center in ${zone || 'body'})`);
                    return 'text';
                }
            }

            if (label === 'page_footer') {
                // If labeled as footer but NOT in footer zone, change to text
                if (zone !== 'footer') {
                    console.log(`[Fusion] Correcting page_footer → text (not in footer zone, Y center in ${zone || 'body'})`);
                    return 'text';
                }
            }

            return label;  // Position matches label, keep it
        }

        function fallbackDoclingLabel(item) {
            if (!item) return 'text';

            if (item.source === 'header_footer' && item.zone) {
                return item.zone === 'header' ? 'page_header' : 'page_footer';
            }

            const elementType = String(item.element_type || '').toLowerCase();
            if (elementType.includes('table')) return 'table';
            if (elementType.includes('list')) return 'list_item';
            if (elementType.includes('caption')) return 'caption';
            if (elementType.includes('title')) return 'title';
            if (elementType.includes('header')) return 'section_header';
            if (elementType.includes('footer')) return 'page_footer';
            if (elementType.includes('formula')) return 'formula';
            if (elementType.includes('code')) return 'code';
            if (elementType.includes('paragraph')) return 'paragraph';

            return 'text';
        }

        function isPictureArea(item) {
            return !!(item && (item.is_image_part || item.has_pdf_image || item.has_shape_units));
        }

        // Fuse alignment bboxes with Docling labels based on overlap
        // NEW APPROACH: Group alignments by Docling element and merge their bboxes
        function fuseAlignmentWithDocling() {
            doclingFusedResults = [];
            const OVERLAP_THRESHOLD = 0.3;  // 30% overlap required

            const hasDocling = doclingClassifications && doclingClassifications.length > 0;

            // Helper: merge two bboxes into one encompassing bbox
            function mergeBboxes(bbox1, bbox2) {
                if (!bbox1) return bbox2;
                if (!bbox2) return bbox1;
                return [
                    Math.min(bbox1[0], bbox2[0]),  // x0
                    Math.min(bbox1[1], bbox2[1]),  // y0
                    Math.max(bbox1[2], bbox2[2]),  // x1
                    Math.max(bbox1[3], bbox2[3])   // y1
                ];
            }


            // Collect all aligned items (body + header/footer) with their bboxes
            const allAlignedItems = [];

            // Add body alignments
            if (alignments && alignments.length > 0) {
                alignments.forEach(alignment => {
                    if (alignment.is_table && alignment.cells) {
                        alignment.cells.forEach(cell => {
                            if (cell.merged_bbox) {
                                const cellHasImage = (cell.matched_pdf_units || []).some(u => u.item_type === 'image');
                                const cellHasShape = (cell.matched_pdf_units || []).some(u => u.item_type === 'shape');
                                allAlignedItems.push({
                                    bbox: cell.merged_bbox,
                                    text: cell.text || '',
                                    source: 'cell',
                                    element_id: alignment.element_id,
                                    element_type: alignment.element_type,
                                    has_pdf_image: cellHasImage,
                                    has_shape_units: cellHasShape
                                });
                            }
                        });
                    } else if (alignment.merged_bbox) {
                        // Check if matched_pdf_units contain shape type items
                        const matchedUnits = alignment.matched_pdf_units || [];
                        const hasShapeUnits = matchedUnits.some(u => u.item_type === 'shape');
                        const hasPdfImage = matchedUnits.some(u => u.item_type === 'image');

                        allAlignedItems.push({
                            bbox: alignment.merged_bbox,
                            text: alignment.element_text || '',
                            source: 'alignment',
                            element_id: alignment.element_id,
                            element_type: alignment.element_type,
                            element_sequence: alignment.element_sequence,
                            // Include text/image part flags to prevent merging them together
                            is_text_part: alignment.is_text_part || false,
                            is_image_part: alignment.is_image_part || false,
                            // Flag if this alignment contains shape units
                            has_shape_units: hasShapeUnits,
                            has_pdf_image: hasPdfImage,
                            unit_id: alignment.unit_id
                        });
                    }
                });
            }


            // Add header/footer units
            if (headerFooterUnits && headerFooterUnits.length > 0) {
                headerFooterUnits.forEach(unit => {
                    if (unit.bbox) {
                        allAlignedItems.push({
                            bbox: unit.bbox,
                            text: unit.text || '',
                            source: 'header_footer',
                            zone: unit.zone,
                            has_pdf_image: false,
                            has_shape_units: false
                        });
                    }
                });
            }

            // Track which aligned items have been used
            const usedAlignedIndices = new Set();

            // If we have Docling classifications, iterate over them and find matching alignments
            if (hasDocling) {
                doclingClassifications.forEach(docItem => {
                    const docBbox = docItem.bbox;
                    if (!docBbox) return;
                    const isPictureLabel = docItem.label === 'picture';

                    // Find ALL aligned items that overlap with this Docling element
                    const matchingItems = [];
                    allAlignedItems.forEach((item, idx) => {
                        if (usedAlignedIndices.has(idx)) return;

                        const overlap = calculateOverlap(item.bbox, docBbox);
                        if (overlap >= OVERLAP_THRESHOLD) {
                            if (isPictureLabel && !isPictureArea(item)) {
                                return;
                            }
                            matchingItems.push({ item, idx, overlap });
                        }
                    });

                    if (matchingItems.length > 0) {
                        // Mark all matching items as used
                        matchingItems.forEach(m => usedAlignedIndices.add(m.idx));

                        // Check if all matching items have the same element_id (not just same type!)
                        // This prevents merging bboxes from DIFFERENT elements that happen to overlap with same Docling bbox
                        const elementIds = [...new Set(matchingItems.map(m => m.item.element_id).filter(id => id))];
                        const allSameElement = elementIds.length <= 1;

                        // Check if there's a mix of text_part and image_part - never merge those
                        const hasTextPart = matchingItems.some(m => m.item.is_text_part);
                        const hasImagePart = matchingItems.some(m => m.item.is_image_part);
                        const hasMixedParts = hasTextPart && hasImagePart;

                        // Check if any matching items contain shape units (from matched_pdf_units)
                        const hasShapeUnits = matchingItems.some(m => m.item.has_shape_units);

                        // SPECIAL CASE: Docling 'picture' label with shape units - merge all shapes into one bbox
                        // and reference to the OpenXML element whose sequence is closest to the NEXT element
                        const shouldMergePicture = isPictureLabel && matchingItems.length > 1 && hasShapeUnits;

                        // Only merge if: multiple items AND same element AND not mixed text/image parts AND no image parts
                        // EXCEPTION: If Docling label is 'picture' with shapes, always merge shapes together
                        const shouldMerge = (matchingItems.length > 1 && allSameElement && !hasMixedParts && !hasImagePart) || shouldMergePicture;


                        if (shouldMerge) {
                            // Merge all matching bboxes into one
                            let mergedBbox = null;
                            let mergedText = [];
                            let avgOverlap = 0;
                            let sequences = [];
                            let elementIds = [];
                            let elementTypes = [];

                            matchingItems.forEach(m => {
                                mergedBbox = mergeBboxes(mergedBbox, m.item.bbox);
                                if (m.item.text) mergedText.push(m.item.text);
                                avgOverlap += m.overlap;
                                if (m.item.element_sequence) sequences.push(m.item.element_sequence);
                                if (m.item.element_id) elementIds.push(m.item.element_id);
                                if (m.item.element_type) elementTypes.push(m.item.element_type);
                            });

                            avgOverlap /= matchingItems.length;

                            const sources = [...new Set(matchingItems.map(m => m.item.source))];
                            const primarySource = sources.length === 1 ? sources[0] : 'merged';

                            const hasPictureArea = matchingItems.some(m => isPictureArea(m.item));
                            let mergedLabel = docItem.label;
                            if (mergedLabel === 'picture' && !hasPictureArea) {
                                mergedLabel = fallbackDoclingLabel(matchingItems[0].item);
                            }

                            // Correct page_header/page_footer labels if not in margin zone
                            const correctedLabel = correctHeaderFooterLabel(mergedLabel, mergedBbox);

                            // For 'picture' merges, find the element with highest sequence
                            // (closest to the NEXT element after the picture group)
                            let referenceElementId = null;
                            let referenceElementSeq = null;
                            let referenceElementType = null;

                            if (shouldMergePicture && sequences.length > 0) {
                                // Find the highest sequence number (closest to next element)
                                const maxSeq = Math.max(...sequences);
                                const maxSeqIdx = sequences.indexOf(maxSeq);
                                referenceElementSeq = maxSeq;
                                referenceElementId = elementIds[maxSeqIdx] || null;
                                referenceElementType = elementTypes[maxSeqIdx] || null;
                                console.log(`[PictureMerge] Merged ${matchingItems.length} shapes into picture, ref seq=${maxSeq}`);
                            }

                            doclingFusedResults.push({
                                bbox: mergedBbox,
                                label: correctedLabel,
                                text: mergedText.join(' '),
                                overlap: avgOverlap,
                                source: primarySource,
                                merged_count: matchingItems.length,
                                element_sequences: sequences.length > 0 ? sequences.join(', ') : null,
                                // For picture merges: reference the element closest to next
                                element_id: referenceElementId,
                                element_sequence: referenceElementSeq,
                                element_type: referenceElementType,
                                is_picture_merge: shouldMergePicture,
                                docling_label: docItem.label
                            });
                        } else {
                            // Don't merge - add each item separately with Docling label
                            matchingItems.forEach(m => {
                                let finalLabel = docItem.label;
                                if (finalLabel === 'picture' && !isPictureArea(m.item)) {
                                    finalLabel = fallbackDoclingLabel(m.item);
                                }

                                // Correct page_header/page_footer labels if not in margin zone
                                finalLabel = correctHeaderFooterLabel(finalLabel, m.item.bbox);

                                doclingFusedResults.push({
                                    bbox: m.item.bbox,
                                    label: finalLabel,
                                    text: m.item.text || '',
                                    overlap: m.overlap,
                                    source: m.item.source,
                                    element_id: m.item.element_id,
                                    element_type: m.item.element_type,
                                    element_sequence: m.item.element_sequence,
                                    zone: m.item.zone,
                                    docling_label: docItem.label,
                                    is_text_part: m.item.is_text_part,
                                    is_image_part: m.item.is_image_part,
                                    unit_id: m.item.unit_id
                                });
                            });
                        }

                    }

                });
            }

            // Add remaining unmatched aligned items (no Docling match)
            allAlignedItems.forEach((item, idx) => {
                if (usedAlignedIndices.has(idx)) return;

                let label = 'unknown';
                if (item.source === 'header_footer' && item.zone) {
                    label = item.zone === 'header' ? 'page_header' : 'page_footer';
                } else if (item.is_image_part && item.has_pdf_image) {
                    // Unmatched image aligned item - use 'picture' label
                    label = 'picture';
                } else if (item.is_image_part) {
                    label = fallbackDoclingLabel(item);
                }

                // Correct page_header/page_footer labels if bbox not in margin zone
                label = correctHeaderFooterLabel(label, item.bbox);

                doclingFusedResults.push({
                    bbox: item.bbox,
                    label: label,
                    text: item.text,
                    overlap: 0,
                    source: item.source,
                    element_id: item.element_id,
                    element_type: item.element_type,
                    element_sequence: item.element_sequence,
                    zone: item.zone,
                    docling_label: null,
                    is_image_part: item.is_image_part
                });
            });

            // Sort by reading order (top to bottom, left to right)
            doclingFusedResults.sort((a, b) => {
                const yDiff = a.bbox[1] - b.bbox[1];
                if (Math.abs(yDiff) > 10) return yDiff;
                return a.bbox[0] - b.bbox[0];
            });

            const mergedCount = doclingFusedResults.filter(r => r.merged_count > 1).length;
            console.log(`[Fusion] Created ${doclingFusedResults.length} fused results (${mergedCount} merged from multiple alignments)`);
        }



        // Toggle between Docling bbox and aligned bbox mode
        function toggleUseAlignedBbox() {
            useAlignedBbox = !useAlignedBbox;
            const btn = document.getElementById('btnUseAlignedBbox');

            if (useAlignedBbox) {
                btn.textContent = 'Use Docling';
                btn.style.background = '#27ae60';
                btn.style.color = 'white';

                // Compute fusion if not done yet
                fuseAlignmentWithDocling();

                // Auto-show all fused results
                visibleDoclingBbox.clear();
                doclingFusedResults.forEach((_, idx) => visibleDoclingBbox.add(idx));
                showAllDocling = true;
                updateShowAllDoclingBtn();
            } else {
                btn.textContent = 'Use Aligned';
                btn.style.background = 'white';
                btn.style.color = '#27ae60';

                // Switch back to Docling - show all
                visibleDoclingBbox.clear();
                doclingClassifications.forEach((_, idx) => visibleDoclingBbox.add(idx));
            }

            renderDoclingClassifications();
            drawCanvas();
        }

        // Draw Docling bboxes on canvas
        // Supports two modes: original Docling bbox OR aligned bbox with Docling labels
        function drawDoclingBboxes(ctx, scale) {
            const dataSource = useAlignedBbox ? doclingFusedResults : doclingClassifications;

            dataSource.forEach((c, idx) => {
                if (!visibleDoclingBbox.has(idx)) return;

                const bbox = c.bbox;
                if (!bbox || bbox.length < 4) return;

                const color = DOCLING_LABEL_COLORS[c.label] || DOCLING_LABEL_COLORS['unknown'];

                // Convert PDF points to canvas pixels (multiply by scale 1.5)
                const x0 = bbox[0] * scale;
                const y0 = bbox[1] * scale;
                const x1 = bbox[2] * scale;
                const y1 = bbox[3] * scale;

                // Draw filled background with transparency
                ctx.fillStyle = color + '33';  // 20% opacity
                ctx.fillRect(x0, y0, x1 - x0, y1 - y0);

                // Draw border (dashed for docling, solid for aligned)
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                if (useAlignedBbox) {
                    ctx.setLineDash([]);  // Solid line for aligned bbox
                } else {
                    ctx.setLineDash([5, 3]);  // Dashed for Docling bbox
                }
                ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
                ctx.setLineDash([]);

                // Draw label with appropriate prefix
                ctx.font = 'bold 10px Arial';
                ctx.fillStyle = color;
                const prefix = useAlignedBbox ? '📐' : '🔬';
                ctx.fillText(`${prefix}${c.label}`, x0, y0 - 2);
            });
        }


        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                changePage(-1);
            } else if (e.key === 'ArrowRight') {
                changePage(1);
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updatePageButtons();
            loadPageData();
        });
    </script>
