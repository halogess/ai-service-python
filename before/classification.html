<!DOCTYPE html>
<html>

<head>
    <title>Classification - {{ doc.testing_dokumen_nama }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fa;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .card-header-custom {
            background: #f39c12;
            color: white;
            padding: 15px 20px;
            border-bottom: 3px solid #e67e22;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 70px);
        }

        /* Left Panel - PDF Preview */
        .pdf-panel {
            width: 35%;
            background: #dee2e6;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
        }

        .pdf-controls {
            background: white;
            padding: 10px 15px;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .page-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-nav button {
            padding: 4px 10px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .page-nav button:hover:not(:disabled) {
            background: #f0f0f0;
        }

        .page-nav button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 0.85rem;
            color: #666;
        }

        .pdf-body {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 15px;
        }

        .canvas-container {
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            display: inline-block;
            position: relative;
        }

        #pdfCanvas {
            display: block;
        }

        /* Alignment Panel */
        .alignment-panel {
            width: 100%;
            min-width: 50px;
            background: #f0fff0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .alignment-panel.collapsed {
            max-height: 40px;
            min-height: 40px;
        }

        .alignment-panel.collapsed .alignment-list,
        .alignment-panel.collapsed .alignment-controls>*:not(.panel-toggle):not(span:first-of-type) {
            display: none;
        }

        /* Middle Panel - Alignment Group (vertical: aligned + unaligned) */
        .alignment-group {
            width: 25%;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
            overflow: hidden;
        }

        /* Right Panel - Classification (LayoutLM) */
        .classification-panel {
            width: 20%;
            min-width: 200px;
            background: #fff8e1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .classification-controls {
            background: #fff3e0;
            padding: 10px 15px;
            border-bottom: 1px solid #f39c12;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .classification-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .classification-item {
            padding: 8px 12px;
            border-bottom: 1px solid #ffe0b2;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .classification-item:hover {
            background: #fff8e1;
        }

        .classification-item.active {
            background: #fff3e0;
            border-left: 3px solid #f39c12;
        }

        .label-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
        }

        .label-title {
            background: #e74c3c;
        }

        .label-text {
            background: #3498db;
        }

        .label-paragraph {
            background: #3498db;
        }

        .label-list_item {
            background: #2ecc71;
        }

        .label-table {
            background: #f39c12;
        }

        .label-picture {
            background: #9b59b6;
        }

        .label-caption {
            background: #1abc9c;
        }

        .label-section_header {
            background: #e74c3c;
        }

        .label-page_header {
            background: #e67e22;
        }

        .label-page_footer {
            background: #c0392b;
        }

        .label-footnote {
            background: #8b4513;
        }

        .label-formula {
            background: #008080;
        }

        .label-code {
            background: #00CED1;
        }

        .label-unknown {
            background: #95a5a6;
        }

        .alignment-group .alignment-panel {
            border-right: none;
        }

        .alignment-group .alignment-panel:first-child {
            flex: 1;
        }

        .alignment-group .alignment-panel:last-child {
            max-height: 250px;
            min-height: 100px;
        }

        /* Panel Toggle Button */
        .panel-toggle {
            cursor: pointer;
            padding: 4px 8px;
            border: none;
            background: transparent;
            color: inherit;
            font-size: 0.9rem;
        }

        .panel-toggle:hover {
            opacity: 0.7;
        }

        /* Alignment Controls */
        .alignment-controls {
            background: #e8f5e9;
            padding: 10px 15px;
            border-bottom: 1px solid #4caf50;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .alignment-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .alignment-item {
            padding: 8px 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .alignment-item:hover {
            background: #f0fff0;
        }

        .alignment-item.active {
            background: #e8f5e9;
            border-left: 3px solid #4caf50;
        }

        .alignment-score {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 0.7rem;
        }

        .score-high {
            background: #4caf50;
            color: white;
        }

        .score-medium {
            background: #ff9800;
            color: white;
        }

        .score-low {
            background: #f44336;
            color: white;
        }

        .group-btn {
            padding: 4px 10px;
            border: 1px solid #4caf50;
            background: white;
            color: #4caf50;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .group-btn:hover {
            background: #e8f5e9;
        }

        .group-btn.active {
            background: #4caf50;
            color: white;
        }

        .stats-badge {
            background: #4caf50;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .type-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .type-paragraph {
            background: #3498db;
            color: white;
        }

        .type-table {
            background: #e74c3c;
            color: white;
        }

        .type-image {
            background: #27ae60;
            color: white;
        }

        .type-heading {
            background: #f39c12;
            color: white;
        }

        .type-list {
            background: #9b59b6;
            color: white;
        }

        .type-other {
            background: #95a5a6;
            color: white;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        /* Docling Panel (Far Right) */
        .docling-panel {
            width: 20%;
            min-width: 200px;
            background: #e0f7fa;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .docling-controls {
            background: #b2ebf2;
            padding: 10px 15px;
            border-bottom: 1px solid #00acc1;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .docling-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .docling-item {
            padding: 8px 12px;
            border-bottom: 1px solid #b2ebf2;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .docling-item:hover {
            background: #e0f7fa;
        }

        .docling-item.active {
            background: #b2ebf2;
            border-left: 3px solid #00acc1;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="card-header-custom d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0"><i class="fas fa-tags me-2"></i>{{ doc.testing_dokumen_nama }}</h5>
        </div>
        <div>
            <a href="/classification" class="btn btn-light btn-sm me-2"><i class="fas fa-arrow-left me-1"></i>Back</a>
            <a href="/" class="btn btn-light btn-sm"><i class="fas fa-home me-1"></i>Home</a>
        </div>
    </div>

    <div class="main-container">
        <!-- Left Panel - PDF Preview -->
        <div class="pdf-panel">
            <div class="pdf-controls">
                <div class="page-nav">
                    <button id="btnPrevPage" onclick="changePage(-1)" disabled><i
                            class="fas fa-chevron-left"></i></button>
                    <span class="page-info">Page <span id="currentPage">1</span> / <span id="totalPages">{{
                            doc.testing_dokumen_total_pages }}</span></span>
                    <button id="btnNextPage" onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
                <button id="btnMarginLines" onclick="toggleMarginLines()"
                    style="padding: 4px 10px; border: 1px solid #2196F3; background: #2196F3; color: white; border-radius: 4px; font-size: 0.8rem; cursor: pointer;"
                    title="Toggle header/footer margin lines">
                    <i class="fas fa-ruler-horizontal me-1"></i>Margins
                </button>
            </div>

            <div class="pdf-body">
                <div class="canvas-container">
                    <canvas id="pdfCanvas"></canvas>
                    <div class="loading-overlay" id="canvasLoading" style="display: none;">
                        <div class="spinner-border text-secondary" role="status"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Middle Panel - Alignment Group (vertical: aligned + unaligned) -->
        <div class="alignment-group" style="display: flex; flex-direction: column; min-width: 200px;">
            <!-- Char Alignment Panel -->
            <div class="alignment-panel" id="alignmentPanel" style="flex: 1;">
                <div class="alignment-controls">
                    <button class="panel-toggle" onclick="togglePanel('alignmentPanel')" title="Toggle Panel">
                        <i class="fas fa-chevron-left" id="alignmentPanelIcon"></i>
                    </button>
                    <span style="font-weight: 600; color: #4caf50; font-size: 0.85rem;">
                        <i class="fas fa-font me-1"></i>Aligned
                    </span>
                    <button class="group-btn" style="border-color: #4caf50; color: #4caf50;" id="btnShowAllAlignBbox"
                        onclick="toggleShowAllAlignBbox()">Show All</button>
                    <button class="group-btn" style="border-color: #4caf50; color: #4caf50;"
                        onclick="clearAlignBbox()">Clear</button>
                    <span class="stats-badge" style="background: #4caf50;" id="alignmentStats">0</span>
                </div>

                <div class="alignment-list" id="alignmentList">
                    <div style="padding: 15px; text-align: center; color: #888;">Loading alignment...</div>
                </div>
            </div>

            <!-- Char Unaligned Panel (below Char Alignment) -->
            <div class="alignment-panel" id="unalignedPanel"
                style="border-left-color: #e74c3c; background: #fff5f5; border-top: 2px solid #e74c3c;">
                <div class="alignment-controls" style="background: #ffebee; border-bottom-color: #e74c3c;">
                    <button class="panel-toggle" onclick="togglePanel('unalignedPanel')" title="Toggle Panel">
                        <i class="fas fa-chevron-left" id="unalignedPanelIcon"></i>
                    </button>
                    <span style="font-weight: 600; color: #e74c3c; font-size: 0.85rem;">
                        <i class="fas fa-exclamation-circle me-1"></i>Unaligned
                    </span>
                    <button class="group-btn" style="border-color: #e74c3c; color: #e74c3c;" id="btnShowAllUnaligned"
                        onclick="toggleShowAllUnaligned()">Show All</button>
                    <button class="group-btn" style="border-color: #e74c3c; color: #e74c3c;"
                        onclick="clearUnaligned()">Clear</button>
                    <span class="stats-badge" style="background: #e74c3c;" id="unalignedStats">0</span>
                </div>
                <div class="alignment-list" id="unalignedList" style="border-left-color: #e74c3c; max-height: 200px;">
                    <div style="padding: 15px; text-align: center; color: #888;">Run alignment first...</div>
                </div>
            </div>
        </div>

        <!-- Right Panel - Classification (LayoutLM) -->
        <div class="classification-panel">
            <div class="classification-controls">
                <span style="font-weight: 600; color: #f39c12; font-size: 0.85rem;">
                    <i class="fas fa-tags me-1"></i>LayoutLM
                </span>
                <button class="group-btn" style="border-color: #f39c12; color: #f39c12;" id="btnShowAllClassify"
                    onclick="toggleShowAllClassify()">Show All</button>
                <button class="group-btn" style="border-color: #f39c12; color: #f39c12;"
                    onclick="clearClassifyBbox()">Clear</button>
                <span class="stats-badge" style="background: #f39c12;" id="classifyStats">0</span>
            </div>

            <div class="classification-list" id="classificationList">
                <div style="padding: 15px; text-align: center; color: #888;">Waiting for alignment...
                </div>
            </div>
        </div>

        <!-- Far Right Panel - Docling Classification -->
        <div class="docling-panel">
            <div class="docling-controls">
                <span style="font-weight: 600; color: #00acc1; font-size: 0.85rem;">
                    <i class="fas fa-microscope me-1"></i>Docling
                </span>
                <button class="group-btn" style="border-color: #00acc1; color: #00acc1;" id="btnShowAllDocling"
                    onclick="toggleShowAllDocling()">Show All</button>
                <button class="group-btn" style="border-color: #00acc1; color: #00acc1;"
                    onclick="clearDoclingBbox()">Clear</button>
                <button class="group-btn" style="border-color: #27ae60; color: #27ae60;" id="btnUseAlignedBbox"
                    onclick="toggleUseAlignedBbox()" title="Use aligned bboxes with Docling labels">Use Aligned</button>
                <span class="stats-badge" style="background: #00acc1;" id="doclingStats">0</span>
            </div>

            <div class="docling-list" id="doclingList">
                <div style="padding: 15px; text-align: center; color: #888;">Waiting for alignment...
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/pymupdf/char_grouping.js"></script>
    <script src="/static/js/pymupdf/pdf_extraction.js"></script>
    <script src="/static/js/pymupdf/json_tree_renderer.js"></script>
    <script src="/static/js/pymupdf/canvas_renderer.js"></script>
    <script>
        const docId = {{ doc.testing_dokumen_id }};
        const totalPages = {{ doc.testing_dokumen_total_pages }};
        let currentPage = 1;
        let pageImage = null;

        // PDF Extraction state
        let extractionData = null;  // Full extraction result
        let extractionItems = [];   // Processed items array

        const COLORS = {
            alignment: '#27ae60',  // green for alignment bboxes
            unaligned: '#e74c3c'   // red for unaligned
        };

        // Section data for margin lines
        let sectionData = null;  // Current section info (margins, page size)
        let showMarginLines = true;  // Toggle for header/footer lines

        // Panel Toggle
        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            const icon = document.getElementById(panelId + 'Icon');
            panel.classList.toggle('collapsed');
            if (panel.classList.contains('collapsed')) {
                icon.className = 'fas fa-chevron-right';
            } else {
                icon.className = 'fas fa-chevron-left';
            }
        }

        // Toggle margin lines visibility
        function toggleMarginLines() {
            showMarginLines = !showMarginLines;
            const btn = document.getElementById('btnMarginLines');
            if (showMarginLines) {
                btn.style.background = '#2196F3';
                btn.style.color = 'white';
            } else {
                btn.style.background = 'white';
                btn.style.color = '#2196F3';
            }
            drawCanvas();
        }

        // Alignment functions
        let alignments = [];
        let visibleAlignBbox = new Set();  // tracks visible alignment bboxes by element_id
        let showAllAlignBbox = false;
        let alignmentTimestamp = '';
        let pageDebug = {};  // Store page-level debug info

        // Cross-page tracking: stores the maximum OpenXML index assigned per page
        // Used to prevent backward matching when navigating between pages
        let maxOpenXmlIdxPerPage = {};  // page_number -> max_openxml_idx

        // Unaligned groups (PDF groups that didn't match any OpenXML element)
        let unalignedGroups = [];
        let visibleUnaligned = new Set();
        let showAllUnaligned = false;

        // Header/footer filtered units (for debug display)
        let headerFooterUnits = [];

        async function runAlignment(restoreShowAllAlign = false, restoreShowAllUnaligned = false) {
            // Reset alignment bbox visibility on new alignment
            visibleAlignBbox.clear();
            showAllAlignBbox = false;
            updateShowAllAlignBboxBtn();

            // Reset unaligned visibility
            visibleUnaligned.clear();
            showAllUnaligned = false;
            updateShowAllUnalignedBtn();

            if (!extractionItems || extractionItems.length === 0) {
                document.getElementById('alignmentList').innerHTML =
                    '<div style="padding: 15px; text-align: center; color: #888;">No extraction items to align</div>';
                document.getElementById('alignmentStats').textContent = '0';
                return;
            }

            // Show loading state
            document.getElementById('alignmentList').innerHTML = '<div style="padding: 20px; text-align: center;"><i class="fas fa-spinner fa-spin"></i> Aligning...</div>';

            try {
                // Use merging-alignment API: sends extraction items, returns element alignments
                // Include page dimensions for correct section selection (portrait vs landscape)
                const pageWidth = extractionData?.width || 0;
                const pageHeight = extractionData?.height || 0;
                const response = await fetch(`/dokumen-elemen-api/merging-alignment/${docId}/${currentPage}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        extraction_items: extractionItems,
                        page_width: pageWidth,
                        page_height: pageHeight,
                        total_pages: totalPages,
                        // For cross-page backward matching prevention:
                        // Send the max OpenXML index from the previous page
                        min_openxml_idx: currentPage > 1 ? (maxOpenXmlIdxPerPage[currentPage - 1] || 0) : 0
                    })
                });
                const data = await response.json();

                if (data.success) {
                    // Store alignments (single pass - no phase separation)
                    alignments = data.alignments || data.final_alignments || [];
                    unalignedGroups = data.unaligned_pdf_units || [];

                    headerFooterUnits = data.header_footer_units || [];
                    alignmentTimestamp = data.timestamp;
                    pageDebug = data.page_debug || {};

                    // Store max_openxml_idx for cross-page backward prevention
                    // This will be sent as min_openxml_idx when loading the next page
                    if (data.max_openxml_idx !== undefined) {
                        maxOpenXmlIdxPerPage[currentPage] = data.max_openxml_idx;
                        console.log(`[CrossPage] Page ${currentPage} max_openxml_idx: ${data.max_openxml_idx}`);
                    }

                    console.log(`[Alignment] ${alignments.length} aligned, ${unalignedGroups.length} unaligned PDF`);

                    renderAlignments();
                    renderUnalignedGroups();

                    // Restore showAll states after rendering (for page change persistence)
                    if (restoreShowAllAlign && alignments.length > 0) {
                        showAllAlignBbox = true;
                        updateShowAllAlignBboxBtn();
                        alignments.forEach(a => {
                            const alignKey = (!a.is_table && a.unit_id) ? a.unit_id : a.element_id;
                            visibleAlignBbox.add(alignKey);
                        });
                        renderAlignments();
                        drawCanvas();
                    }
                    if (restoreShowAllUnaligned && unalignedGroups.length > 0) {
                        showAllUnaligned = true;
                        updateShowAllUnalignedBtn();
                        unalignedGroups.forEach((_, idx) => visibleUnaligned.add(idx));
                        renderUnalignedGroups();
                        drawCanvas();
                    }

                    // Note: runClassification() is now called after extraction, not alignment
                    // so we don't need to trigger it here anymore
                }

            } catch (error) {
                console.error('Alignment error:', error);
                const errorHtml = `<div style="padding: 15px; color: #f44336;">Error: ${error.message}</div>`;
                document.getElementById('alignmentList').innerHTML = errorHtml;
            }
        }

        function updateShowAllAlignBboxBtn() {
            const btn = document.getElementById('btnShowAllAlignBbox');
            if (showAllAlignBbox) {
                btn.classList.add('active');
                btn.textContent = 'Hide All';
                btn.style.background = '#4caf50';
                btn.style.color = 'white';
            } else {
                btn.classList.remove('active');
                btn.textContent = 'Show All';
                btn.style.background = 'white';
                btn.style.color = '#4caf50';
            }
        }

        function toggleShowAllAlignBbox() {
            showAllAlignBbox = !showAllAlignBbox;
            if (showAllAlignBbox) {
                alignments.forEach(a => {
                    // Use unit_id for non-table elements if available, otherwise element_id
                    const alignKey = (!a.is_table && a.unit_id) ? a.unit_id : a.element_id;
                    visibleAlignBbox.add(alignKey);
                    // For tables, also add cell IDs
                    if (a.is_table && a.cells) {
                        a.cells.forEach(cell => {
                            visibleAlignBbox.add(`${a.element_id}_r${cell.row}_c${cell.col}`);
                        });
                    }
                });
            } else {
                visibleAlignBbox.clear();
            }
            updateShowAllAlignBboxBtn();
            renderAlignments();
            drawCanvas();
        }


        function clearAlignBbox() {
            visibleAlignBbox.clear();
            showAllAlignBbox = false;
            updateShowAllAlignBboxBtn();
            renderAlignments();
            drawCanvas();
        }

        function toggleAlignBbox(elemId) {
            if (visibleAlignBbox.has(elemId)) {
                visibleAlignBbox.delete(elemId);
            } else {
                visibleAlignBbox.add(elemId);
            }
            renderAlignments();
            drawCanvas();
        }

        function renderAlignments() {
            const container = document.getElementById('alignmentList');
            document.getElementById('alignmentStats').textContent = alignments.length;

            if (alignments.length === 0) {
                container.innerHTML = '<div style="padding: 15px; text-align: center; color: #888;">No alignments found</div>';
                return;
            }

            let html = '';
            alignments.forEach((a, idx) => {
                const isVisible = visibleAlignBbox.has(a.element_id);

                if (a.is_table && a.cells && a.cells.length > 0) {
                    // Table element: show header with cell count, then nested cells
                    const cellCount = a.cells.length;
                    html += `<div class="alignment-item ${isVisible ? 'active' : ''}" style="${isVisible ? 'background: #e8f5e9; border-left: 3px solid #4caf50;' : ''}" onclick="toggleAlignBbox(${a.element_id})">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">

                            <span style="background: #e74c3c; color: white; padding: 1px 6px; border-radius: 10px; font-size: 0.65rem;">${cellCount} cells</span>

                    a.cells.forEach((cell, cellIdx) => {

                                    ${escapeHtml(u.text || '')}

                            html += `</div>`;

                        html += `</div>`;

                    html += `</div>`;
                } else {
                    // Non-table element: show as before but use unit_id if available
                    const pdfUnitCount = a.matched_pdf_units ? a.matched_pdf_units.length : 0;
                    // Use unit_id as key if available (for separate text/image parts), otherwise element_id
                    const alignKey = a.unit_id || a.element_id;

                    }

                    html += `<div class="alignment-item ${isVisible ? 'active' : ''}" style="${isVisible ? 'background: #e8f5e9; border-left: 3px solid #4caf50;' : ''}" onclick="toggleAlignBbox('${alignKey}')">

                    // Show matched PDF units

                            const unitNum = u.pdf_unit_id ? u.pdf_unit_id.replace(/\D/g, '') : uIdx;
                            const typeLabel = u.item_type ? u.item_type.toUpperCase().substring(0, 3) : 'PDF';
                            html += `<div style="font-size: 0.65rem; color: #f39c12; font-family: monospace; margin-top: 2px; display: flex; align-items: center; gap: 3px;">

            renderUnalignedGroups();
            drawCanvas();

            showAllUnaligned = !showAllUnaligned;

                unalignedGroups.forEach((_, idx) => visibleUnaligned.add(idx));

                visibleUnaligned.clear();

            renderUnalignedGroups();
