<!DOCTYPE html>
<html>
<head>
    <title>OpenXML-PDF Alignment</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 8px; font-size: 14px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .results { margin-top: 30px; }
        .stats { background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .stat-item { display: inline-block; margin-right: 30px; }
        .words-table { width: 100%; border-collapse: collapse; }
        .words-table th, .words-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .words-table th { background: #007bff; color: white; }
        .confidence-high { background: #d4edda; }
        .confidence-medium { background: #fff3cd; }
        .confidence-low { background: #f8d7da; }
        .error { color: red; padding: 10px; background: #f8d7da; border-radius: 5px; }
        .loading { display: none; padding: 10px; background: #cce5ff; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpenXML-PDF Word Alignment</h1>
        
        <div class="form-group">
            <label for="dokumen_id">Dokumen ID:</label>
            <input type="number" id="dokumen_id" placeholder="e.g., 117" value="117">
        </div>
        
        <button onclick="performAlignment()">Align Document</button>
        
        <div class="loading" id="loading">Processing alignment...</div>
        <div class="error" id="error" style="display:none;"></div>
        
        <div class="results" id="results" style="display:none;">
            <h2>Alignment Results</h2>
            
            <div class="stats">
                <div class="stat-item">
                    <strong>Total Words:</strong> <span id="total_words">-</span>
                </div>
                <div class="stat-item">
                    <strong>Assigned:</strong> <span id="assigned_words">-</span>
                </div>
                <div class="stat-item">
                    <strong>Coverage:</strong> <span id="coverage">-</span>
                </div>
            </div>
            
            <h3>Aligned Words (First 100)</h3>
            <table class="words-table" id="words_table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Text</th>
                        <th>Element ID</th>
                        <th>Page</th>
                        <th>Confidence</th>
                        <th>BBox</th>
                    </tr>
                </thead>
                <tbody id="words_tbody">
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        function performAlignment() {
            const dokumenId = document.getElementById('dokumen_id').value;
            
            if (!dokumenId) {
                alert('Please enter Dokumen ID');
                return;
            }
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            
            // Call API
            fetch('/alignment/align', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    dokumen_id: dokumenId
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                
                if (!data.success) {
                    document.getElementById('error').textContent = 'Error: ' + data.error;
                    document.getElementById('error').style.display = 'block';
                    return;
                }
                
                // Display results
                displayResults(data.data);
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Error: ' + error.message;
                document.getElementById('error').style.display = 'block';
            });
        }
        
        function displayResults(data) {
            document.getElementById('results').style.display = 'block';
            
            // Stats
            document.getElementById('total_words').textContent = data.stats.total_words;
            document.getElementById('assigned_words').textContent = data.stats.assigned_words;
            document.getElementById('coverage').textContent = (data.stats.coverage * 100).toFixed(2) + '%';
            
            // Words table
            const tbody = document.getElementById('words_tbody');
            tbody.innerHTML = '';
            
            const words = data.aligned_words.slice(0, 100);
            words.forEach((word, index) => {
                const tr = document.createElement('tr');
                
                // Confidence class
                let confClass = '';
                if (word.confidence >= 0.9) confClass = 'confidence-high';
                else if (word.confidence >= 0.7) confClass = 'confidence-medium';
                else confClass = 'confidence-low';
                
                tr.className = confClass;
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${word.text}</td>
                    <td>${word.element_id || 'N/A'}</td>
                    <td>${word.page}</td>
                    <td>${word.confidence.toFixed(2)}</td>
                    <td>${word.bbox.x0.toFixed(1)}, ${word.bbox.y0.toFixed(1)}</td>
                `;
                
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
