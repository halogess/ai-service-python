<!DOCTYPE html>
<html>

<head>
    <title>Alignment - {{ doc.testing_dokumen_nama }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fa;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .card-header-custom {
            background: #8e44ad;
            color: white;
            padding: 15px 20px;
            border-bottom: 3px solid #9b59b6;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 70px);
        }

        /* Left Panel - PDF Preview */
        .pdf-panel {
            width: 40%;
            background: #dee2e6;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
        }

        .pdf-controls {
            background: white;
            padding: 10px 15px;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .page-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-nav button {
            padding: 4px 10px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .page-nav button:hover:not(:disabled) {
            background: #f0f0f0;
        }

        .page-nav button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 0.85rem;
            color: #666;
        }

        .pdf-body {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 15px;
        }

        .canvas-container {
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            display: inline-block;
            position: relative;
        }

        #pdfCanvas {
            display: block;
        }

        /* Middle Panel - Groups */
        .groups-panel {
            width: 15%;
            min-width: 50px;
            background: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        .groups-panel.collapsed {
            width: 50px;
            min-width: 50px;
        }

        .groups-panel.collapsed .groups-list,
        .groups-panel.collapsed .group-controls>*:not(.panel-toggle) {
            display: none;
        }

        /* Alignment Panel */
        .alignment-panel {
            width: 100%;
            min-width: 50px;
            background: #f0fff0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .alignment-panel.collapsed {
            max-height: 40px;
            min-height: 40px;
        }

        .alignment-panel.collapsed .alignment-list,
        .alignment-panel.collapsed .alignment-controls>*:not(.panel-toggle):not(span:first-of-type) {
            display: none;
        }

        /* Alignment Group - vertical container for aligned + unaligned */
        .alignment-group {
            width: 15%;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
            overflow: hidden;
        }

        .alignment-group .alignment-panel {
            border-right: none;
        }

        .alignment-group .alignment-panel:first-child {
            flex: 1;
        }

        .alignment-group .alignment-panel:last-child {
            max-height: 180px;
            min-height: 80px;
        }

        /* Right Panel - Elements */
        .content-panel {
            width: 25%;
            min-width: 50px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        .content-panel.collapsed {
            width: 50px;
            min-width: 50px;
        }

        .content-panel.collapsed .elements-section {
            display: none;
        }

        /* Panel Toggle Button */
        .panel-toggle {
            cursor: pointer;
            padding: 4px 8px;
            border: none;
            background: transparent;
            color: inherit;
            font-size: 0.9rem;
        }

        .panel-toggle:hover {
            opacity: 0.7;
        }

        /* Alignment Controls */
        .alignment-controls {
            background: #e8f5e9;
            padding: 10px 15px;
            border-bottom: 1px solid #4caf50;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .alignment-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .alignment-item {
            padding: 8px 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .alignment-item:hover {
            background: #f0fff0;
        }

        .alignment-item.active {
            background: #e8f5e9;
            border-left: 3px solid #4caf50;
        }

        .alignment-score {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 0.7rem;
        }

        .score-high {
            background: #4caf50;
            color: white;
        }

        .score-medium {
            background: #ff9800;
            color: white;
        }

        .score-low {
            background: #f44336;
            color: white;
        }

        /* Element panel header */
        .element-controls {
            background: #e8e0f0;
            padding: 10px 15px;
            border-bottom: 1px solid #8e44ad;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Char Group Controls */
        .group-controls {
            background: #fff8e6;
            padding: 10px 15px;
            border-bottom: 1px solid #f39c12;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .group-btn {
            padding: 4px 10px;
            border: 1px solid #f39c12;
            background: white;
            color: #f39c12;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .group-btn:hover {
            background: #fef5e6;
        }

        .group-btn.active {
            background: #f39c12;
            color: white;
        }

        .stats-badge {
            background: #f39c12;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        /* Groups List */
        .groups-list {
            background: white;
            flex: 1;
            overflow-y: auto;
        }

        .group-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
            gap: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .group-item:hover {
            background: #fef9f0;
        }

        .group-item.active {
            background: #fff3cd;
            border-left: 3px solid #f39c12;
        }

        .group-text {
            font-family: monospace;
            flex: 1;
            word-break: break-all;
        }

        .group-chars-count {
            color: #888;
            font-size: 0.7rem;
        }

        /* Elements Accordion */
        .elements-section {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: white;
        }

        .accordion-button:not(.collapsed) {
            background-color: #f3e8ff;
            color: #8e44ad;
        }

        .type-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .type-paragraph {
            background: #3498db;
            color: white;
        }

        .type-table {
            background: #e74c3c;
            color: white;
        }

        .type-image {
            background: #27ae60;
            color: white;
        }

        .type-heading {
            background: #f39c12;
            color: white;
        }

        .type-list {
            background: #9b59b6;
            color: white;
        }

        .type-other {
            background: #95a5a6;
            color: white;
        }

        .sequence-badge {
            background: #2c3e50;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 10px;
        }

        /* JSON Tree Styles */
        .json-tree-container {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 10px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.8rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .json-node {
            border-bottom: 1px solid #f0f0f0;
        }

        .json-row {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            cursor: default;
            gap: 6px;
        }

        .json-row:hover {
            background: #f0f0f0;
        }

        .json-row.expandable {
            cursor: pointer;
        }

        .json-toggle {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 0.6rem;
            flex-shrink: 0;
            transition: transform 0.15s;
        }

        .json-toggle.expanded {
            transform: rotate(90deg);
        }

        .json-toggle.empty {
            visibility: hidden;
        }

        .json-key {
            color: #0550ae;
            font-weight: 500;
            flex-shrink: 0;
        }

        .json-colon {
            color: #6c757d;
        }

        .json-value {
            word-break: break-all;
            flex: 1;
            min-width: 0;
        }

        .json-value.string {
            color: #0a3069;
        }

        .json-value.number {
            color: #0550ae;
        }

        .json-value.boolean {
            color: #cf222e;
        }

        .json-value.null {
            color: #8250df;
            font-style: italic;
        }

        .json-type-hint {
            color: #8b949e;
            font-size: 0.7rem;
        }

        .json-children {
            display: none;
            padding-left: 16px;
            border-left: 1px dashed #dee2e6;
            margin-left: 6px;
        }

        .json-children.show {
            display: block;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="card-header-custom d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0"><i class="fas fa-sitemap me-2"></i>{{ doc.testing_dokumen_nama }}</h5>
        </div>
        <div>
            <a href="/dokumen-elemen" class="btn btn-light btn-sm me-2"><i class="fas fa-arrow-left me-1"></i>Back</a>
            <a href="/" class="btn btn-light btn-sm"><i class="fas fa-home me-1"></i>Home</a>
        </div>
    </div>

    <div class="main-container">
        <!-- Left Panel - PDF Preview -->
        <div class="pdf-panel">
            <div class="pdf-controls">
                <div class="page-nav">
                    <button id="btnPrevPage" onclick="changePage(-1)" disabled><i
                            class="fas fa-chevron-left"></i></button>
                    <span class="page-info">Page <span id="currentPage">1</span> / <span id="totalPages">{{
                            doc.testing_dokumen_total_pages }}</span></span>
                    <button id="btnNextPage" onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
                <button id="btnMarginLines" onclick="toggleMarginLines()"
                    style="padding: 4px 10px; border: 1px solid #2196F3; background: #2196F3; color: white; border-radius: 4px; font-size: 0.8rem; cursor: pointer;"
                    title="Toggle header/footer margin lines">
                    <i class="fas fa-ruler-horizontal me-1"></i>Margins
                </button>
            </div>

            <div class="pdf-body">
                <div class="canvas-container">
                    <canvas id="pdfCanvas"></canvas>
                    <div class="loading-overlay" id="canvasLoading" style="display: none;">
                        <div class="spinner-border text-secondary" role="status"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PDF Extraction Panel (merging results) -->
        <div class="groups-panel" id="extractionPanel" style="background: #fff3e0; width: 25%;">
            <div class="group-controls" style="background: #ffe0b2; border-bottom-color: #ff9800;">
                <button class="panel-toggle" onclick="togglePanel('extractionPanel')" title="Toggle Panel">
                    <i class="fas fa-chevron-left" id="extractionPanelIcon"></i>
                </button>
                <span style="font-weight: 600; color: #ff9800; font-size: 0.85rem;">
                    <i class="fas fa-file-pdf me-1"></i>Extraction
                </span>
                <button class="group-btn" style="border-color: #ff9800; color: #ff9800;" id="btnShowAllExtraction"
                    onclick="toggleShowAllExtraction()">Show All</button>
                <button class="group-btn" style="border-color: #ff9800; color: #ff9800;"
                    onclick="clearExtraction()">Clear</button>
                <span class="stats-badge" style="background: #ff9800;" id="extractionStats">0</span>
            </div>
            <div class="groups-list" id="extractionList" style="font-size: 0.75rem;">
                <div style="padding: 15px; text-align: center; color: #888;">Loading extraction...</div>
            </div>
        </div>

        <!-- Char Alignment Group (vertical: aligned + unaligned) -->
        <div class="alignment-group" style="display: flex; flex-direction: column; min-width: 180px;">
            <!-- Char Alignment Panel -->
            <div class="alignment-panel" id="alignmentPanel" style="flex: 1;">
                <div class="alignment-controls">
                    <button class="panel-toggle" onclick="togglePanel('alignmentPanel')" title="Toggle Panel">
                        <i class="fas fa-chevron-left" id="alignmentPanelIcon"></i>
                    </button>
                    <span style="font-weight: 600; color: #4caf50; font-size: 0.85rem;">
                        <i class="fas fa-font me-1"></i>Char Alignment
                    </span>
                    <button class="group-btn" style="border-color: #4caf50; color: #4caf50;" id="btnShowAllAlignBbox"
                        onclick="toggleShowAllAlignBbox()">Show All</button>
                    <button class="group-btn" style="border-color: #4caf50; color: #4caf50;"
                        onclick="clearAlignBbox()">Clear</button>
                    <button class="group-btn" style="border-color: #4caf50; color: #4caf50; background: #e8f5e9;"
                        onclick="showPageDebug()" title="Show character-based matching debug info">🔍 Debug</button>
                    <span class="stats-badge" style="background: #4caf50;" id="alignmentStats">0</span>
                    <span style="font-size: 0.65rem; color: #666; margin-left: auto;" id="alignmentTimestamp"></span>
                </div>

                <div class="alignment-list" id="alignmentList">
                    <div style="padding: 15px; text-align: center; color: #888;">Run alignment...</div>
                </div>
            </div>

            <!-- Char Unaligned Panel (below Char Alignment) -->
            <div class="alignment-panel" id="unalignedPanel"
                style="border-left-color: #e74c3c; background: #fff5f5; border-top: 2px solid #e74c3c;">
                <div class="alignment-controls" style="background: #ffebee; border-bottom-color: #e74c3c;">
                    <button class="panel-toggle" onclick="togglePanel('unalignedPanel')" title="Toggle Panel">
                        <i class="fas fa-chevron-left" id="unalignedPanelIcon"></i>
                    </button>
                    <span style="font-weight: 600; color: #e74c3c; font-size: 0.85rem;">
                        <i class="fas fa-exclamation-circle me-1"></i>Unaligned
                    </span>
                    <button class="group-btn" style="border-color: #e74c3c; color: #e74c3c;" id="btnShowAllUnaligned"
                        onclick="toggleShowAllUnaligned()">Show All</button>
                    <button class="group-btn" style="border-color: #e74c3c; color: #e74c3c;"
                        onclick="clearUnaligned()">Clear</button>
                    <span class="stats-badge" style="background: #e74c3c;" id="unalignedStats">0</span>
                </div>
                <div class="alignment-list" id="unalignedList" style="border-left-color: #e74c3c; max-height: 150px;">
                    <div style="padding: 15px; text-align: center; color: #888;">Run alignment first...</div>
                </div>
            </div>
        </div>

        <!-- Unaligned OpenXML Panel (OpenXML elements without matching bbox) - Separate Column -->
        <div class="alignment-panel" id="unalignedOpenxmlPanel"
            style="border-left-color: #ff9800; background: #fff8e1; min-width: 140px; max-width: 200px; width: 15%;">
            <div class="alignment-controls" style="background: #fff3e0; border-bottom-color: #ff9800;">
                <button class="panel-toggle" onclick="togglePanel('unalignedOpenxmlPanel')" title="Toggle Panel">
                    <i class="fas fa-chevron-left" id="unalignedOpenxmlPanelIcon"></i>
                </button>
                <span style="font-weight: 600; color: #ff9800; font-size: 0.85rem;">
                    <i class="fas fa-file-word me-1"></i>No BBox
                </span>
                <button class="group-btn" style="border-color: #ff9800; color: #ff9800;" id="btnShowAllUnalignedOpenxml"
                    onclick="toggleShowAllUnalignedOpenxml()">Show All</button>
                <button class="group-btn" style="border-color: #ff9800; color: #ff9800;"
                    onclick="clearUnalignedOpenxml()">Clear</button>
                <span class="stats-badge" style="background: #ff9800;" id="unalignedOpenxmlStats">0</span>
            </div>
            <div class="alignment-list" id="unalignedOpenxmlList" style="border-left-color: #ff9800;">
                <div style="padding: 15px; text-align: center; color: #888;">Run alignment first...</div>
            </div>
        </div>

        <!-- Right Panel - Elements (Collapsible) -->
        <div class="content-panel" id="elementsPanel">
            <div class="element-controls">
                <button class="panel-toggle" onclick="togglePanel('elementsPanel')" title="Toggle Panel">
                    <i class="fas fa-chevron-left" id="elementsPanelIcon"></i>
                </button>
                <span style="font-weight: 600; color: #8e44ad; font-size: 0.85rem;">
                    <i class="fas fa-sitemap me-1"></i>Elements
                </span>
            </div>
            <div class="elements-section">
                <div id="loadingSpinner" style="text-align: center; padding: 50px;">
                    <div class="spinner-border text-secondary" role="status"></div>
                </div>
                <div id="accordionContainer" class="accordion" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/pymupdf/char_grouping.js"></script>
    <script src="/static/js/pymupdf/pdf_extraction.js"></script>
    <script src="/static/js/pymupdf/json_tree_renderer.js"></script>
    <script src="/static/js/pymupdf/canvas_renderer.js"></script>
    <script>
        const docId = {{ doc.testing_dokumen_id }};
        const totalPages = {{ doc.testing_dokumen_total_pages }};
        let currentPage = 1;
        let pageImage = null;

        // PDF Extraction state
        let extractionData = null;  // Full extraction result
        let extractionItems = [];   // Processed items array
        let visibleExtractionItems = new Set();
        let visibleExtractionCells = new Set();
        let showAllExtraction = false;

        const COLORS = {
            alignment: '#8e44ad',  // purple for alignment bboxes
            extraction: '#ff9800'  // orange for extraction items
        };

        // Section data for margin lines
        let sectionData = null;  // Current section info (margins, page size)
        let showMarginLines = true;  // Toggle for header/footer lines

        // Panel Toggle
        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            const icon = document.getElementById(panelId + 'Icon');
            panel.classList.toggle('collapsed');
            if (panel.classList.contains('collapsed')) {
                icon.className = 'fas fa-chevron-right';
            } else {
                icon.className = 'fas fa-chevron-left';
            }
        }

        // Toggle margin lines visibility
        function toggleMarginLines() {
            showMarginLines = !showMarginLines;
            const btn = document.getElementById('btnMarginLines');
            if (showMarginLines) {
                btn.style.background = '#2196F3';
                btn.style.color = 'white';
            } else {
                btn.style.background = 'white';
                btn.style.color = '#2196F3';
            }
            drawCanvas();
        }

        // Alignment functions
        let alignments = [];
        let visibleAlignBbox = new Set();  // tracks visible alignment bboxes by element_id
        let showAllAlignBbox = false;
        let alignmentTimestamp = '';
        let pageDebug = {};  // Store page-level debug info

        // Cross-page tracking: stores the maximum OpenXML index assigned per page
        // Used to prevent backward matching when navigating between pages
        let maxOpenXmlIdxPerPage = {};  // page_number -> max_openxml_idx

        // Unaligned groups (PDF groups that didn't match any OpenXML element)
        let unalignedGroups = [];
        let visibleUnaligned = new Set();
        let showAllUnaligned = false;

        // Header/footer filtered units (for debug display)
        let headerFooterUnits = [];

        // Unaligned OpenXML elements (elements without matching bbox)
        let unalignedOpenxmlUnits = [];
        let visibleUnalignedOpenxml = new Set();
        let showAllUnalignedOpenxml = false;


        async function runAlignment(restoreShowAllAlign = false, restoreShowAllUnaligned = false) {
            // Reset alignment bbox visibility on new alignment
            visibleAlignBbox.clear();
            showAllAlignBbox = false;
            updateShowAllAlignBboxBtn();

            // Reset unaligned visibility
            visibleUnaligned.clear();
            showAllUnaligned = false;
            updateShowAllUnalignedBtn();

            if (!extractionItems || extractionItems.length === 0) {
                document.getElementById('alignmentList').innerHTML =
                    '<div style="padding: 15px; text-align: center; color: #888;">No extraction items to align</div>';
                document.getElementById('alignmentStats').textContent = '0';

                document.getElementById('alignmentTimestamp').textContent = '';
                return;
            }

            // Show loading state
            document.getElementById('alignmentList').innerHTML = '<div style="padding: 20px; text-align: center;"><i class="fas fa-spinner fa-spin"></i> Aligning...</div>';

            try {
                // Use merging-alignment API: sends extraction items, returns element alignments
                // Include page dimensions for correct section selection (portrait vs landscape)
                const pageWidth = extractionData?.width || 0;
                const pageHeight = extractionData?.height || 0;
                const response = await fetch(`/dokumen-elemen-api/merging-alignment/${docId}/${currentPage}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        extraction_items: extractionItems,
                        page_width: pageWidth,
                        page_height: pageHeight,
                        total_pages: totalPages,
                        // For cross-page backward matching prevention:
                        // Send the max OpenXML index from the previous page
                        min_openxml_idx: currentPage > 1 ? (maxOpenXmlIdxPerPage[currentPage - 1] || 0) : 0
                    })
                });
                const data = await response.json();

                if (data.success) {
                    // Store alignments (single pass - no phase separation)
                    alignments = data.alignments || data.final_alignments || [];
                    unalignedGroups = data.unaligned_pdf_units || [];

                    headerFooterUnits = data.header_footer_units || [];
                    alignmentTimestamp = data.timestamp;
                    pageDebug = data.page_debug || {};

                    // Store max_openxml_idx for cross-page backward prevention
                    // This will be sent as min_openxml_idx when loading the next page
                    if (data.max_openxml_idx !== undefined) {
                        maxOpenXmlIdxPerPage[currentPage] = data.max_openxml_idx;
                        console.log(`[CrossPage] Page ${currentPage} max_openxml_idx: ${data.max_openxml_idx}`);
                    }

                    // Store unaligned OpenXML units (elements without matching bbox)
                    unalignedOpenxmlUnits = data.unaligned_openxml_units || [];
                    console.log(`[Alignment] ${alignments.length} aligned, ${unalignedGroups.length} unaligned PDF, ${unalignedOpenxmlUnits.length} unaligned OpenXML`);

                    renderAlignments();
                    renderUnalignedGroups();
                    renderUnalignedOpenxml();

                    // Restore showAll states after rendering (for page change persistence)
                    if (restoreShowAllAlign && alignments.length > 0) {
                        showAllAlignBbox = true;
                        updateShowAllAlignBboxBtn();
                        alignments.forEach(a => visibleAlignBbox.add(a.element_id));
                        renderAlignments();
                        drawCanvas();
                    }
                    if (restoreShowAllUnaligned && unalignedGroups.length > 0) {
                        showAllUnaligned = true;
                        updateShowAllUnalignedBtn();
                        unalignedGroups.forEach((_, idx) => visibleUnaligned.add(idx));
                        renderUnalignedGroups();
                        drawCanvas();
                    }
                }

            } catch (error) {
                console.error('Alignment error:', error);
                const errorHtml = `<div style="padding: 15px; color: #f44336;">Error: ${error.message}</div>`;
                document.getElementById('alignmentList').innerHTML = errorHtml;
            }
        }

        // Copy traversal log to clipboard
        function copyTraversalLog(type) {
            const logElement = document.getElementById('charTraversalLog');
            if (!logElement) {
                alert('Traversal log not found');
                return;
            }

            const logText = logElement.textContent || logElement.innerText;
            navigator.clipboard.writeText(logText).then(() => {
                // Find the button and show feedback
                const buttons = document.querySelectorAll('button');
                buttons.forEach(btn => {
                    if (btn.textContent.includes('Copy Log') && btn.closest('div').querySelector('h5')?.textContent.includes('Traversal')) {
                        btn.textContent = '✓ Copied!';
                        btn.style.background = '#27ae60';
                        setTimeout(() => {
                            btn.textContent = '📋 Copy Log';
                            btn.style.background = '#17a2b8';
                        }, 2000);
                    }
                });
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }

        // Show page-level debug overlay - STEP BY STEP
        function showPageDebug() {
            if (!pageDebug || Object.keys(pageDebug).length === 0) {
                alert('No debug info available. Run alignment first.');
                return;
            }

            // Remove existing overlay
            const existing = document.getElementById('pageDebugOverlay');
            if (existing) existing.remove();

            // Create overlay
            const overlay = document.createElement('div');
            overlay.id = 'pageDebugOverlay';
            overlay.style.cssText = `

                display: flex; align-items: center; justify-content: center;
            `;
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

            const cb = pageDebug.char_based || {};

            // Build PDF Units step HTML
            let pdfUnitsHtml = '';
            if (cb.pdf_unit_ranges && cb.pdf_unit_ranges.length > 0) {
                cb.pdf_unit_ranges.forEach((u, i) => {
                    pdfUnitsHtml += `<tr>
                        <td style="padding: 4px; border: 1px solid #ddd;">${u.unit_id}</td>
                        <td style="padding: 4px; border: 1px solid #ddd;">${u.item_type}</td>

            }

            // Build OpenXML Units step HTML
            let openxmlUnitsHtml = '';
            if (cb.openxml_unit_ranges && cb.openxml_unit_ranges.length > 0) {
                cb.openxml_unit_ranges.forEach((u, i) => {
                    openxmlUnitsHtml += `<tr>
                        <td style="padding: 4px; border: 1px solid #ddd;">${u.unit_id}</td>
                        <td style="padding: 4px; border: 1px solid #ddd;">${u.elem_type || ''}</td>

            // Build matching blocks HTML
            let blocksHtml = '';
            if (cb.matching_blocks && cb.matching_blocks.length > 0) {

                    </tr>`;
                });
            }

            // Build unit matching summary HTML
            let summaryHtml = '';
            if (cb.unit_matching_summary && cb.unit_matching_summary.length > 0) {
                cb.unit_matching_summary.forEach(u => {
                    const matchedTo = u.matched_to && u.matched_to.length > 0
                        ? u.matched_to.map(m => `${m.openxml_unit_id}(${m.matched_chars}c)`).join(', ')
                        : '<span style="color:#e74c3c;">unmatched</span>';
                    const consumedStyle = u.consumed ? 'background:#d5f5e3;' : 'background:#ffebee;';
                    summaryHtml += `<tr style="${consumedStyle}">
                        <td style="padding: 4px; border: 1px solid #ddd;">${u.pdf_unit_idx}</td>

        // Load page data (image + merging extraction)
        async function loadPageData() {
            const canvasLoading = document.getElementById('canvasLoading');
            canvasLoading.style.display = 'flex';

            // Save showAll states before reset (for persistence across page changes)
            const savedShowAllExtraction = showAllExtraction;
            const savedShowAllAlignBbox = showAllAlignBbox;
            const savedShowAllUnaligned = showAllUnaligned;

            // Reset extraction
            extractionData = null;
            extractionItems = [];
            visibleExtractionItems.clear();
            visibleExtractionCells.clear();
            showAllExtraction = false;
            updateShowAllExtractionBtn();
            document.getElementById('extractionList').innerHTML = '<div style="padding: 15px; text-align: center; color: #888;"><i class="fas fa-spinner fa-spin"></i> Loading extraction...</div>';

            // Reset alignment bboxes
            visibleAlignBbox.clear();
            showAllAlignBbox = false;
            updateShowAllAlignBboxBtn();

            try {
                // Load page image
                const imgResponse = await fetch(`/pymupdf-api/page-image/${docId}/${currentPage}`);
                const imgData = await imgResponse.json();

                if (imgData.success && imgData.image_base64) {
                    // Convert base64 to blob, then to ImageBitmap
                    const binaryData = atob(imgData.image_base64);
                    const bytes = new Uint8Array(binaryData.length);
                    for (let i = 0; i < binaryData.length; i++) {
                        bytes[i] = binaryData.charCodeAt(i);
                    }
                    const blob = new Blob([bytes], { type: 'image/png' });
                    pageImage = await createImageBitmap(blob);
                } else {
                    console.error('Failed to load page image:', imgData.error);
                    pageImage = null;
                }

                // Load section data (for header/footer margin lines)
                try {
                    const secResponse = await fetch(`/dokumen-elemen-api/sections/${docId}`);
                    const secData = await secResponse.json();
                    if (secData.success && secData.sections && secData.sections.length > 0) {
                        // Find the section that matches current page dimensions
                        // Compare with actual rendered page dimensions from pageImage
                        if (pageImage && secData.sections.length > 1) {
                            const pageWidth = pageImage.width / 1.5;  // Undo the 1.5 scale
                            const pageHeight = pageImage.height / 1.5;

                            // Find section with matching dimensions (tolerance of 10 points)
                            const matchingSection = secData.sections.find(sec => {
                                const secWidth = sec.page_width_pt || 595;
                                const secHeight = sec.page_height_pt || 842;
                                const widthMatch = Math.abs(secWidth - pageWidth) < 10;
                                const heightMatch = Math.abs(secHeight - pageHeight) < 10;
                                return widthMatch && heightMatch;
                            });

                            sectionData = matchingSection || secData.sections[0];
                            console.log('Section matched by dimensions:', sectionData,
                                'Page:', pageWidth, 'x', pageHeight);
                        } else {
                            // Only one section or no page image, use first
                            sectionData = secData.sections[0];
                        }
                        console.log('Section data loaded:', sectionData);
                    } else {
                        sectionData = null;
                        console.log('No section data available');
                    }
                } catch (secErr) {
                    console.error('Error loading section data:', secErr);
                    sectionData = null;
                }

                // Load PDF extraction data (merging) - main data source for alignment
                try {
                    if (typeof PdfExtraction !== 'undefined') {
                        extractionData = await PdfExtraction.extractMergingData(docId, currentPage);
                        extractionItems = extractionData.items;
                        document.getElementById('extractionStats').textContent = extractionData.stats.total;
                        renderExtractionList();

                        // Restore extraction showAll state after rendering
                        if (savedShowAllExtraction) {
                            showAllExtraction = true;
                            updateShowAllExtractionBtn();
                            extractionItems.forEach((_, idx) => visibleExtractionItems.add(idx));
                            renderExtractionList();
                        }
                    }
                } catch (extErr) {
                    console.error('Extraction error:', extErr);
                    document.getElementById('extractionList').innerHTML = '<div style="padding: 15px; color: #f44336;">Extraction failed: ' + extErr.message + '</div>';
                }

                drawCanvas();

                // Run alignment after extraction is loaded (pass saved states to restore)
                await runAlignment(savedShowAllAlignBbox, savedShowAllUnaligned);

            } catch (error) {
                console.error('Error loading page data:', error);
            }

            canvasLoading.style.display = 'none';
        }

        // Draw canvas
        function drawCanvas() {
            const canvas = document.getElementById('pdfCanvas');
            const ctx = canvas.getContext('2d');

            if (!pageImage) return;

            // Set canvas size
            canvas.width = pageImage.width;
            canvas.height = pageImage.height;

            // Draw the page image
            ctx.drawImage(pageImage, 0, 0);

            const scale = 1.5;

            // Draw header and footer margin lines if section data is available
            if (showMarginLines && sectionData) {
                // Calculate line positions based on section margins
                // sectionData contains margin_top_pt, margin_bottom_pt, page_height_pt, header_margin_pt, footer_margin_pt
                const pageHeightPt = sectionData.page_height_pt || 842;  // Default A4 height in points
                const pageWidthPt = sectionData.page_width_pt || 595;    // Default A4 width in points

                // PDF coordinates: origin at bottom-left, but canvas origin at top-left
                // So we need to convert: canvas_y = page_height - pdf_y
                // But PyMuPDF renders with origin at top-left, so margin_top is directly usable

                const marginTopPt = sectionData.margin_top_pt || 72;      // Default 1 inch
                const marginBottomPt = sectionData.margin_bottom_pt || 72;
                const headerMarginPt = sectionData.header_margin_pt || 36; // Default 0.5 inch
                const footerMarginPt = sectionData.footer_margin_pt || 36;

                // Header line: position at margin_top (top of content area)
                // This separates header zone from body content
                const headerLineY = marginTopPt * scale;

                // Footer line: position at (page_height - margin_bottom)
                // This separates body content from footer zone
                const footerLineY = (pageHeightPt - marginBottomPt) * scale;

                // Header zone top line (where header content starts)
                const headerZoneLineY = headerMarginPt * scale;

                // Footer zone bottom line (where footer content ends)
                const footerZoneLineY = (pageHeightPt - footerMarginPt) * scale;

                const canvasWidth = canvas.width;

                // Draw header margin line (blue dashed line)
                ctx.strokeStyle = '#2196F3';  // Blue
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 5]);

                // Header zone line (lighter, thinner)
                ctx.strokeStyle = '#64B5F6';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, headerZoneLineY);
                ctx.lineTo(canvasWidth, headerZoneLineY);
                ctx.stroke();

                // Main header line (content area top)
                ctx.strokeStyle = '#2196F3';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, headerLineY);
                ctx.lineTo(canvasWidth, headerLineY);
                ctx.stroke();

                // Footer zone line (lighter, thinner)
                ctx.strokeStyle = '#64B5F6';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, footerZoneLineY);
                ctx.lineTo(canvasWidth, footerZoneLineY);
                ctx.stroke();

                // Main footer line (content area bottom)
                ctx.strokeStyle = '#2196F3';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, footerLineY);
                ctx.lineTo(canvasWidth, footerLineY);
                ctx.stroke();

                ctx.setLineDash([]);  // Reset dash

                // Draw labels
                ctx.font = 'bold 10px Arial';
                ctx.fillStyle = '#2196F3';
                ctx.fillText('↑ HEADER ZONE', 5, headerLineY - 5);
                ctx.fillText('↓ FOOTER ZONE', 5, footerLineY + 12);
            }

            // Draw visible extraction items
            extractionItems.forEach((item, idx) => {
                if (!visibleExtractionItems.has(idx)) return;

                const bbox = item.bbox;
                if (bbox && bbox.length >= 4) {
                    // Get color based on type
                    let color = COLORS.extraction;
                    if (item.type === 'group') color = '#8e44ad';
                    else if (item.type === 'table') color = '#e74c3c';
                    else if (item.type === 'hline_table') color = '#c0392b';
                    else if (item.type === 'shape') color = '#3498db';
                    else if (item.type === 'image') color = '#27ae60';

                    // Draw filled background
                    ctx.fillStyle = color + '33';  // 20% opacity
                    ctx.fillRect(
                        bbox[0] * scale,
                        bbox[1] * scale,
                        (bbox[2] - bbox[0]) * scale,
                        (bbox[3] - bbox[1]) * scale
                    );

                    // Draw border
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(
                        bbox[0] * scale,
                        bbox[1] * scale,
                        (bbox[2] - bbox[0]) * scale,
                        (bbox[3] - bbox[1]) * scale
                    );

                    // Draw label
                    ctx.font = 'bold 9px Arial';
                    ctx.fillStyle = color;
                    const label = `[${idx}] ${item.type.toUpperCase()}`;
                    ctx.fillText(label, bbox[0] * scale, bbox[1] * scale - 3);

                    // For tables, also draw visible cells
                    if ((item.type === 'table' || item.type === 'hline_table') && item.data.rows) {
                        item.data.rows.forEach((row, rIdx) => {
                            if (row.cells) {
                                row.cells.forEach((cell, cIdx) => {
                                    const cellKey = `table_${idx}_cell_${rIdx}_${cIdx}`;
                                    if (visibleExtractionCells.has(cellKey) && cell.bbox) {
                                        // Draw cell bbox
                                        ctx.fillStyle = '#f39c1233';
                                        ctx.fillRect(
                                            cell.bbox[0] * scale,
                                            cell.bbox[1] * scale,
                                            (cell.bbox[2] - cell.bbox[0]) * scale,
                                            (cell.bbox[3] - cell.bbox[1]) * scale
                                        );
                                        ctx.strokeStyle = '#f39c12';
                                        ctx.lineWidth = 1.5;
                                        ctx.strokeRect(
                                            cell.bbox[0] * scale,
                                            cell.bbox[1] * scale,
                                            (cell.bbox[2] - cell.bbox[0]) * scale,
                                            (cell.bbox[3] - cell.bbox[1]) * scale
                                        );
                                        ctx.font = 'bold 8px Arial';
                                        ctx.fillStyle = '#f39c12';
                                        ctx.fillText(`R${rIdx}C${cIdx}`, cell.bbox[0] * scale + 2, cell.bbox[1] * scale + 10);

                                        // Draw content bbox if exists
                                        if (cell.content) {
                                            cell.content.forEach(content => {
                                                if (content.bbox) {
                                                    ctx.strokeStyle = content.type === 'text' ? '#9b59b6' : '#27ae60';
                                                    ctx.lineWidth = 1;
                                                    ctx.setLineDash([2, 2]);
                                                    ctx.strokeRect(
                                                        content.bbox[0] * scale,
                                                        content.bbox[1] * scale,
                                                        (content.bbox[2] - content.bbox[0]) * scale,
                                                        (content.bbox[3] - content.bbox[1]) * scale
                                                    );
                                                    ctx.setLineDash([]);
                                                }
                                            });
                                        }
                                    }
                                });
                            }
                        });
                    }
                }
            });

            // Draw visible unaligned groups bboxes (Character-based - Red)
            unalignedGroups.forEach((g, idx) => {
                if (!visibleUnaligned.has(idx)) return;

                const bbox = g.bbox;
                if (bbox && bbox.length >= 4) {
                    ctx.strokeStyle = '#e74c3c';  // Red for char unaligned
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([6, 3]);
                    ctx.strokeRect(
                        bbox[0] * scale,
                        bbox[1] * scale,
                        (bbox[2] - bbox[0]) * scale,
                        (bbox[3] - bbox[1]) * scale
                    );
                    ctx.setLineDash([]);

                    // Draw label
                    const groupNum = g.group_id ? g.group_id.replace(/\D/g, '') : idx;
                    ctx.font = 'bold 10px Arial';
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillText(`[G${groupNum}] ❌C`, bbox[0] * scale, bbox[1] * scale - 2);
                }
            });

            // Draw visible alignment bboxes (merged bbox from matched groups)
            alignments.forEach(a => {
                const parentVisible = visibleAlignBbox.has(a.element_id);

                if (a.is_table && a.cells) {
                    // Table: draw parent bbox if visible
                    if (parentVisible) {
                        const bbox = a.merged_bbox;
                        if (bbox && bbox.length >= 4) {
                            ctx.strokeStyle = '#e74c3c';  // Red for tables
                            ctx.lineWidth = 3;
                            ctx.setLineDash([8, 4]);
                            ctx.strokeRect(
                                bbox[0] * scale,
                                bbox[1] * scale,
                                (bbox[2] - bbox[0]) * scale,
                                (bbox[3] - bbox[1]) * scale
                            );
                            ctx.setLineDash([]);

                            // Draw table label
                            ctx.font = 'bold 12px Arial';
                            ctx.fillStyle = '#e74c3c';
                            ctx.fillText(`#${a.element_sequence} ${a.element_type}`, bbox[0] * scale, bbox[1] * scale - 4);
                        }
                    }

                    // Draw individual cell bboxes
                    a.cells.forEach(cell => {
                        const cellId = `${a.element_id}_r${cell.row}_c${cell.col}`;
                        if (!visibleAlignBbox.has(cellId)) return;

                        const bbox = cell.merged_bbox;
                        if (bbox && bbox.length >= 4) {
                            ctx.strokeStyle = '#c0392b';  // Darker red for cells
                            ctx.lineWidth = 2;
                            ctx.setLineDash([4, 2]);
                            ctx.strokeRect(
                                bbox[0] * scale,
                                bbox[1] * scale,
                                (bbox[2] - bbox[0]) * scale,
                                (bbox[3] - bbox[1]) * scale
                            );
                            ctx.setLineDash([]);

                            // Draw cell label
                            ctx.font = 'bold 10px Arial';
                            ctx.fillStyle = '#c0392b';
                            ctx.fillText(`[R${cell.row},C${cell.col}]`, bbox[0] * scale, bbox[1] * scale - 2);
                        }
                    });
                } else {
                    // Non-table: draw as before
                    if (!parentVisible) return;

                    const bbox = a.merged_bbox;
                    if (bbox && bbox.length >= 4) {
                        ctx.strokeStyle = '#27ae60'; // Green for character alignment
                        ctx.lineWidth = 3;
                        ctx.setLineDash([8, 4]);
                        ctx.strokeRect(
                            bbox[0] * scale,
                            bbox[1] * scale,
                            (bbox[2] - bbox[0]) * scale,
                            (bbox[3] - bbox[1]) * scale
                        );
                        ctx.setLineDash([]);

                        // Draw element label
                        ctx.font = 'bold 12px Arial';
                        ctx.fillStyle = '#27ae60';
                        ctx.fillText(`#${a.element_sequence} ${a.element_type}`, bbox[0] * scale, bbox[1] * scale - 4);
                    }
                }
            });
        }

        // =====================
        // Elements Accordion
        // =====================

        function getTypeBadgeClass(type) {
            if (!type) return 'type-other';
            const t = type.toLowerCase();
            if (t.includes('paragraph')) return 'type-paragraph';
            if (t.includes('table')) return 'type-table';
            if (t.includes('image') || t.includes('figure')) return 'type-image';
            if (t.includes('heading') || t.includes('title')) return 'type-heading';
            if (t.includes('list')) return 'type-list';
            return 'type-other';
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function renderValue(value) {
            if (value === null) return '<span class="json-value null">null</span>';
            if (typeof value === 'string') {
                if (value.length > 100 && /^[A-Za-z0-9+/=]+$/.test(value)) {
                    return `<span class="json-value string">"[Base64: ${value.length} chars]"</span>`;
                }
                return `<span class="json-value string">"${escapeHtml(value)}"</span>`;
            }
            if (typeof value === 'number') return `<span class="json-value number">${value}</span>`;
            if (typeof value === 'boolean') return `<span class="json-value boolean">${value}</span>`;
            return `<span class="json-value">${escapeHtml(String(value))}</span>`;
        }

        function buildJsonTree(data, path = '') {
            if (data === null || data === undefined) {
                return `<div class="json-node"><div class="json-row"><span class="json-toggle empty"></span>${renderValue(data)}</div></div>`;
            }

            if (Array.isArray(data)) {
                if (data.length === 0) return `<div class="json-node"><div class="json-row"><span class="json-toggle empty"></span><span class="json-value">[ ]</span></div></div>`;
                let html = '';
                data.forEach((item, idx) => {
                    const nodeId = 'node_' + Math.random().toString(36).substr(2, 9);
                    const isComplex = typeof item === 'object' && item !== null;
                    if (isComplex) {
                        const typeHint = Array.isArray(item) ? `Array[${item.length}]` : `Object{${Object.keys(item).length}}`;
                        html += `<div class="json-node"><div class="json-row expandable" onclick="toggleNode('${nodeId}', this)"><span class="json-toggle"><i class="fas fa-chevron-right"></i></span><span class="json-key">[${idx}]</span><span class="json-type-hint">${typeHint}</span></div><div class="json-children" id="${nodeId}">${buildJsonTree(item)}</div></div>`;
                    } else {
                        html += `<div class="json-node"><div class="json-row"><span class="json-toggle empty"></span><span class="json-key">[${idx}]</span><span class="json-colon">:</span>${renderValue(item)}</div></div>`;
                    }
                });
                return html;
            }

            if (typeof data === 'object') {
                const keys = Object.keys(data);
                if (keys.length === 0) return `<div class="json-node"><div class="json-row"><span class="json-toggle empty"></span><span class="json-value">{ }</span></div></div>`;
                let html = '';
                keys.forEach(key => {
                    const value = data[key];
                    const nodeId = 'node_' + Math.random().toString(36).substr(2, 9);
                    const isComplex = typeof value === 'object' && value !== null;
                    if (isComplex) {
                        const typeHint = Array.isArray(value) ? `Array[${value.length}]` : `Object{${Object.keys(value).length}}`;
                        html += `<div class="json-node"><div class="json-row expandable" onclick="toggleNode('${nodeId}', this)"><span class="json-toggle"><i class="fas fa-chevron-right"></i></span><span class="json-key">"${escapeHtml(key)}"</span><span class="json-type-hint">${typeHint}</span></div><div class="json-children" id="${nodeId}">${buildJsonTree(value)}</div></div>`;
                    } else {
                        html += `<div class="json-node"><div class="json-row"><span class="json-toggle empty"></span><span class="json-key">"${escapeHtml(key)}"</span><span class="json-colon">:</span>${renderValue(value)}</div></div>`;
                    }
                });
                return html;
            }

            return `<div class="json-node"><div class="json-row"><span class="json-toggle empty"></span>${renderValue(data)}</div></div>`;
        }

        function toggleNode(nodeId, rowEl) {
            const children = document.getElementById(nodeId);
            const toggle = rowEl.querySelector('.json-toggle');
            if (children.classList.contains('show')) {
                children.classList.remove('show');
                toggle.classList.remove('expanded');
            } else {
                children.classList.add('show');
                toggle.classList.add('expanded');
            }
        }

        async function loadElements() {
            const spinner = document.getElementById('loadingSpinner');
            const accordion = document.getElementById('accordionContainer');

            try {
                const response = await fetch(`/dokumen-elemen-api/elements/${docId}`);
                const data = await response.json();

                spinner.style.display = 'none';

                if (data.success) {
                    if (data.elements.length === 0) {
                        accordion.innerHTML = '<div class="alert alert-secondary"><i class="fas fa-info-circle me-2"></i>No elements found.</div>';
                        accordion.style.display = 'block';
                        return;
                    }

                    let html = '';
                    data.elements.forEach((elem, idx) => {
                        const typeClass = getTypeBadgeClass(elem.dokumen_elemen_type);
                        const jsonTreeHtml = buildJsonTree(elem.dokumen_elemen_json_tree);

                        html += `<div class="accordion-item">
                            <h2 class="accordion-header" id="heading${idx}">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${idx}">
                                    <span class="sequence-badge">#${elem.dokumen_elemen_sequence || idx}</span>
                                    <span class="type-badge ${typeClass}">${elem.dokumen_elemen_type || 'unknown'}</span>
                                    <span class="ms-3 text-muted" style="font-size: 0.8rem;">ID: ${elem.dokumen_elemen_id}</span>
                                </button>
                            </h2>
                            <div id="collapse${idx}" class="accordion-collapse collapse">
                                <div class="accordion-body">
                                    <div class="json-tree-container">${jsonTreeHtml}</div>
                                </div>
                            </div>
                        </div>`;
                    });

                    accordion.innerHTML = html;
                    accordion.style.display = 'block';
                }
            } catch (error) {
                spinner.style.display = 'none';
                accordion.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
                accordion.style.display = 'block';
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                changePage(-1);
            } else if (e.key === 'ArrowRight') {
                changePage(1);
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updatePageButtons();
            loadPageData();
            loadElements();
        });
    </script>
</body>
